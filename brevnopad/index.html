function music(){if(musicTimer)return;musicTimer=setInterval(()=>{if(!S.mus||!S.snd||demo||$('modal').classList.contains('show')||document.hidden)return;beep(PENT[Math.floor(Math.random()*PENT.length)]/2,'sine',1.8,.015)},2600)}
function spawn(x,y,vx,vy){if(logs.length>=160)logs.shift();logs.push({x,y,vx,vy,g:Math.random()<.08,a:0,dead:false})}
function chop(t){if(!t||t.hp<=0)return;started=true;lj.dir=Math.sign(t.x-lj.x)||lj.dir;lj.x+=(t.x-lj.x)*.6;lj.sw=.25;t.hp--;t.sh=.25;beep(120);for(let k=0;k<6;k++)parts.push({x:t.x,y:92,vx:rnd(-90,90),vy:rnd(-160,-40),t:.5,c:'#b98a4a'});shake=Math.max(shake,.08);for(let k=0;k<1+S.up.axe;k++)spawn(t.x+rnd(-10,10),100,rnd(-40,40),rnd(0,30));if(t.hp===0)t.t=2.5}
function quest(l){const d=S.dq;d.p.logs++;if(l.g)d.p.gold++;d.p.combo=Math.max(d.p.combo,combo);for(const [id,name,required]of DQ)if(d.p[id]>=required&&!d.r[id]){d.r[id]=1;S.coins+=30;toast('Задание выполнено: '+name+'! +30 монет');save()}}
function showVictory(kind,stars=3,reward=0){
 winKind=kind;winZone=zi;
 const challenge=kind==='challenge',title=challenge?'Испытание пройдено!':'Поляна покорена!';
 $('victory-title').textContent=challenge?'Задача решена!':'Зона пройдена!';
 $('victory-stars').textContent=challenge?'🌟🌟🌟':'★'.repeat(stars)+'☆'.repeat(3-stars);
 $('victory-info').textContent=challenge?(reward?'Награда +'+reward+' монет. Решение сохранено.':'Решение сохранено!'):ZONES[zi].n+' · '+got+' брёвен · '+Math.max(1,Math.round(zt))+' сек. Следующая зона открыта!';
 $('v-next').textContent=challenge?'📜 Другие испытания':(zi<ZONES.length-1?'🌲 Следующая зона':'🗺️ Все зоны');
 $('victory-sparks').innerHTML=Array.from({length:18},(_,i)=>'<i style="--x:'+(5+(i*37)%90)+'%;--y:'+(4+(i*29)%74)+'%;--c:'+['#ffe08c','#f78b54','#9ae47c','#9fe8fe'][i%4]+';--r:'+(i*31)+'deg;--delay:-'+((i%7)*.3)+'s"></i>').join('');
 $('victory').classList.add('show');$('victory').setAttribute('aria-hidden','false');
 $('v-next').focus();beep(660,'triangle',.3,.06);
}
function closeVictory(){ $('victory').classList.remove('show');$('victory').setAttribute('aria-hidden','true') }
$('v-next').addEventListener('click',()=>{closeVictory();if(winKind==='challenge'){menu.tab='c';menu();return}if(winZone+1<S.unlocked&&winZone+1<ZONES.length)enter(winZone+1);else{menu.tab='z';menu()}});
$('v-retry').addEventListener('click',()=>{closeVictory();if(winKind==='challenge'){const c=ch;startCh(c)}else enter(winZone)});
$('v-menu').addEventListener('click',()=>{closeVictory();menu.tab=winKind==='challenge'?'c':'z';menu()});
function completeChallenge(){if(ch<0||done)return;const c=CH[ch];if((c.gold?gg:got)<c.goal)return;done=true;const first=!S.chDone[ch];S.chDone[ch]=1;S.sol[ch]=pieces.map(p=>[p.k,Math.round(p.ax),Math.round(p.ay),Math.round(p.bx),Math.round(p.by)]);if(first)S.coins+=c.r;save();showVictory('challenge',3,first?c.r:0)}
function deliver(l){if(demo){flash=.25;return}const now=performance.now();combo=now-lastDel<1500?combo+1:1;lastDel=now;const m=Math.min(10,1+Math.floor(combo/4)),gain=(1+S.up.val)*m*(l.g?5:1);S.coins+=gain;S.maxC=Math.max(S.maxC,combo);S.total++;got++;if(l.g)gg++;beep(300+Math.min(combo,20)*40);quest(l);completeChallenge();if(lvl()>lv){lv=lvl();toast('Ядро выросло! Уровень '+(lv+1));beep(520,'square',.3,.07);shake=.35}pops.push({x:W/2+rnd(-20,20),y:H-70,t:.85,s:'+'+gain,m});flash=.23;if(m>=4)shake=Math.max(shake,.12);for(let k=0;k<(l.g?14:6);k++)parts.push({x:W/2,y:H-40,vx:rnd(-120,120),vy:rnd(-220,-60),t:.6,c:l.g?'#ffe28a':'#ff9a4a'});
const z=ZONES[zi];if(ch<0&&z.goal&&got>=z.goal&&!done){done=true;S.unlocked=Math.max(S.unlocked,Math.min(ZONES.length,zi+2));const stars=1+(zt<=STT[zi]?1:0)+(used<=3?1:0);S.stars[zi]=Math.max(S.stars[zi]||0,stars);const rec=S.rec[zi]||{};if(rec.t==null||zt<rec.t)rec.t=Math.round(zt);if(rec.p==null||used<rec.p)rec.p=used;S.rec[zi]=rec;save();showVictory('zone',stars)}}
function hit(l,ax,ay,bx,by,e=.25,boost=0,rr=0){const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,((l.x-ax)*dx+(l.y-ay)*dy)/L)):0,px=ax+t*dx,py=ay+t*dy,q=R+2+rr;let vx=l.x-px,vy=l.y-py,d=Math.hypot(vx,vy);if(d>=q)return;let nx=d?vx/d:0,ny=d?vy/d:-1;l.x+=nx*(q-d);l.y+=ny*(q-d);const vn=l.vx*nx+l.vy*ny;if(vn<0){l.vx-=(1+e)*vn*nx;l.vy-=(1+e)*vn*ny;if(boost){l.vx+=nx*boost;l.vy+=ny*boost}}}
function collideLogs(){/* Spatial buckets: nearby pairs only, rather than O(n²) over all logs. */const size=24,buckets=new Map();for(let i=0;i<logs.length;i++){const a=logs[i],x=Math.floor(a.x/size),y=Math.floor(a.y/size);for(let xx=x-1;xx<=x+1;xx++)for(let yy=y-1;yy<=y+1;yy++){const neighbors=buckets.get(xx+','+yy);if(!neighbors)continue;for(const j of neighbors){const b=logs[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2>=4*R*R)continue;const d=Math.sqrt(d2)||.001,nx=d2?dx/d:1,ny=d2?dy/d:0,o=(2*R-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(rv<0){const impulse=rv*.55;a.vx+=impulse*nx;a.vy+=impulse*ny;b.vx-=impulse*nx;b.vy-=impulse*ny}}}const key=x+','+y;if(!buckets.has(key))buckets.set(key,[]);buckets.get(key).push(i)}}
function step(dt){lj.sw=Math.max(0,lj.sw-dt);if(started&&!done)zt+=dt;if(demo){demoT+=dt;if(demoT>.4){demoT=0;const a=trees.filter(t=>t.hp>0);if(a.length)chop(a[Math.floor(Math.random()*a.length)])}}shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt);for(const q of parts){q.vy+=500*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.t-=dt}parts=parts.filter(q=>q.t>0);for(const t of trees){t.sh=Math.max(0,t.sh-dt);if(t.hp===0){t.t-=dt;if(t.t<=0)t.hp=5}}if(damT>0)damT-=dt;
if(S.up.auto>0&&!demo){if(!lj.t||lj.t.hp<=0){const a=trees.filter(t=>t.hp>0);lj.t=a.length?a[Math.floor(Math.random()*a.length)]:null;autoT=0}if(lj.t){const dx=lj.t.x-lj.x;if(Math.abs(dx)>6){lj.x+=Math.sign(dx)*Math.min(Math.abs(dx),70*dt);lj.dir=Math.sign(dx);lj.f=1}else{lj.f=0;autoT+=dt;if(autoT>Math.max(.4,2.6-.4*S.up.auto)){autoT=0;chop(lj.t)}}}}
for(let s=0;s<2;s++){const h=dt/2;for(const l of logs){l.vy+=600*h;l.vx*=.999;l.x+=l.vx*h;l.y+=l.vy*h;l.a+=l.vx*h*.12;if(l.x<R){l.x=R;l.vx*=-.4}if(l.x>W-R){l.x=W-R;l.vx*=-.4}for(const p of pieces){if(p.k==='fan'){const mx=(p.ax+p.bx)/2,my=(p.ay+p.by)/2;if(Math.hypot(l.x-mx,l.y-my)<65){const dx=p.bx-p.ax,dy=p.by-p.ay,d=Math.hypot(dx,dy)||1;l.vx+=dx/d*900*h;l.vy+=dy/d*900*h}continue}if(p.k==='dam'&&damT>0)continue;hit(l,p.ax,p.ay,p.bx,p.by,p.k==='bounce'?1.1:.25,p.k==='bounce'?170:0)}for(const r of ZONES[zi].rocks)hit(l,r[0],r[1],r[0],r[1],.3,0,r[2]);for(const v of ZONES[zi].lava)if(Math.hypot(l.x-v[0],l.y-v[1])<v[2]+R)l.dead=true}collideLogs()}
for(let i=logs.length-1;i>=0;i--){const l=logs[i];if(l.dead||l.y>H+20)logs.splice(i,1);else if(Math.hypot(l.x-W/2,l.y-H)<coreR()){deliver(l);logs.splice(i,1)}}for(const p of pops){p.t-=dt;p.y-=30*dt}pops=pops.filter(p=>p.t>0);if(performance.now()-lastDel>1500)combo=0}

function ellipse(x,y,rx,ry,color){cx.fillStyle=color;cx.beginPath();cx.ellipse(x,y,rx,ry,0,0,TAU);cx.fill()}
function poly(points,fill,stroke,sw=1){cx.beginPath();cx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)cx.lineTo(points[i][0],points[i][1]);cx.closePath();if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=sw;cx.stroke()}}
function line(ax,ay,bx,by,w,col){cx.lineWidth=w;cx.strokeStyle=col;cx.lineCap='round';cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke()}
function rounded(x,y,w,h,r,fill,stroke,sw=1){cx.beginPath();cx.roundRect(x,y,w,h,r);if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.lineWidth=sw;cx.strokeStyle=stroke;cx.stroke()}}
function beamGradient(x,y,r,inner,mid){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,inner);g.addColorStop(.44,mid);g.addColorStop(1,'#ffb64700');return g}
function drawImageCover(img,dx,dy,dw,dh,ox=.5,oy=.5){
 const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;if(!iw||!ih)return;
 const s=Math.max(dw/iw,dh/ih),sw=dw/s,sh=dh/s,sx=(iw-sw)*ox,sy=(ih-sh)*oy;
 cx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh)
}

function getBackdropCache(){

 if(backdropCache)return backdropCache;
 const c=document.createElement('canvas');c.width=W;c.height=H;
 const context=c.getContext('2d');const iw=forestBackdrop.naturalWidth,ih=forestBackdrop.naturalHeight;
 const cover=(x,y,w,h,ox,oy)=>{const s=Math.max(w/iw,h/ih),sw=w/s,sh=h/s;context.drawImage(forestBackdrop,(iw-sw)*ox,(ih-sh)*oy,sw,sh,x,y,w,h)};
 context.save();context.globalAlpha=.28;context.filter='blur(22px) saturate(.92) brightness(.78)';cover(-18,-14,W+36,H+28,.5,.5);context.restore();cover(0,0,W,H,.5,.36);backdropCache=c;return c
}

  const floatCol=zi===4?'#fff':zi===3?'#ffa945':'#e8ff8d';
  const wave=(base,amp,step,col,alpha=1,phase=0)=>{cx.save();cx.globalAlpha=alpha;cx.fillStyle=col;cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W+8;x+=step){const y=base+Math.sin((x+phase)/58)*amp+Math.cos((x+phase)/33)*amp*.35;cx.lineTo(x,y)}cx.lineTo(W,H);cx.closePath();cx.fill();cx.restore()};
  const bg=getBackdropCache();if(bg){cx.drawImage(bg,0,0)}else{const f=cx.createLinearGradient(0,0,0,H);f.addColorStop(0,'#59ab62');f.addColorStop(.4,'#286d3f');f.addColorStop(1,'#112f29');cx.fillStyle=f;cx.fillRect(0,0,W,H)}

  const side=cx.createLinearGradient(0,0,W,0);side.addColorStop(0,'#08201286');side.addColorStop(.16,'#08201228');side.addColorStop(.5,'#0000');side.addColorStop(.84,'#08201228');side.addColorStop(1,'#08201286');cx.fillStyle=side;cx.fillRect(0,0,W,H);

  for(let k=0;k<17;k++){const x=k*26-22,y=-8+7*Math.sin(k*2.8);ellipse(x,y,24,13,k%3?'#15492d':'#2a6934')}
  for(let k=0;k<7;k++){const x=k*55-4;ellipse(x,-1,12,7,k%2?'#6d9d37':'#3d873a')}

  // Декоративные боковые элементы в духе зоны.
  for(let i=0;i<5;i++){
    const leftY=178+i*78,rightY=208+i*68;
    if(zi===4){poly([[8,leftY+16],[18,leftY-8],[28,leftY+18]],'#d7f4ff88');poly([[W-28,rightY+18],[W-18,rightY-10],[W-8,rightY+18]],'#d7f4ff88')}

  }

}

 cx.restore();}

 cx.textAlign='center';cx.font='bold 11px system-ui';cx.fillStyle='#fff0c8';cx.shadowColor='#000';cx.shadowBlur=3;cx.fillText('⚙ '+pieces.length+' / '+(maxP()>99?'∞':maxP())+' деталей',59,H-22);cx.fillText('✦ Ядро '+(lvl()+1)+' ур.',300,H-22);cx.shadowBlur=0;
}
function draw(now){
 cx.save();if(shake>0)cx.translate(rnd(-1,1)*shake*11,rnd(-1,1)*shake*11);

 if(drag){cx.save();cx.setLineDash([5,5]);line(drag.ax,drag.ay,drag.bx,drag.by,5,'#3c1c0aa8');line(drag.ax,drag.ay,drag.bx,drag.by,3,'#fff6be');cx.setLineDash([]);cx.restore()}
 for(const l of logs)drawLog(l,now);
 for(const q of parts){cx.globalAlpha=Math.min(1,q.t*2.3);circ(q.x,q.y,2.2,q.c)}cx.globalAlpha=1;
 cx.textAlign='center';for(const p of pops){cx.save();cx.globalAlpha=Math.min(1,p.t*2);cx.shadowColor='#27160c';cx.shadowBlur=4;cx.font='950 '+(15+p.m*2)+'px system-ui';cx.fillStyle=p.m>=4?'#ffe24b':'#fff0a3';cx.fillText(p.s,p.x,p.y);cx.restore()}
 if(zi===0&&!S.tut&&!demo){rounded(24,145,312,64,14,'#214124e8','#f4c469',2);rounded(29,150,302,54,11,'#152a18dd','#b98236',1);cx.textAlign='center';cx.fillStyle='#fff5d1';cx.shadowColor='#000b';cx.shadowBlur=3;cx.font='bold 13px system-ui';cx.fillText('🌲 Нажми на ёлку, чтобы рубить.',180,169);cx.font='12px system-ui';cx.fillText('🪵 Выбери «Горка» и проведи линию.',180,191);cx.shadowBlur=0}
 drawFloatingHUD();
 cx.restore();
 $('coins').textContent=Math.floor(S.coins);$('goal').textContent=ZONES[zi].goal?Math.min(got,ZONES[zi].goal)+' / '+ZONES[zi].goal:'∞ '+got;
 $('combo').textContent='×'+Math.min(10,1+Math.floor(combo/4))+(combo?' ('+combo+')':'');let text=goals(now);if($('goal2').textContent!==text)$('goal2').textContent=text;const target=ch>=0?CH[ch].goal:ZONES[zi].goal,value=ch>=0?(CH[ch].gold?gg:got):got,percent=target?Math.min(100,Math.round(value/target*100)):100;if($('progress-fill').style.width!==percent+'%')$('progress-fill').style.width=percent+'%';const cp=demo?'Показ схемы':target?(percent+'% · '+(ch>=0?'Испытание':ZONES[zi].n)):'Свободный режим';if($('progress-caption').textContent!==cp)$('progress-caption').textContent=cp;
}
function chText(c){return c.n+': '+(c.gold?c.goal+' золотых':c.goal+' брёвен')+(c.ban?', без «'+({bounce:'Батут',ramp:'Горка',dam:'Плотина',fan:'Ветер'}[c.ban])+'»':'')+(c.max?', не больше '+c.max+' деталей':'')}
function goals(now){if(demo)return 'Показ схемы. Коснись поля, чтобы выйти.';if(ch>=0)return done?'Задача решена! Можно выбрать следующую в меню.':chText(CH[ch])+' ('+(CH[ch].gold?gg:got)+'/'+CH[ch].goal+')';if(done)return 'Победа! Следующая зона открыта в меню.';if(!started)return ZH[zi];const a=[],u=UP.map(x=>[x,cost(x)]).sort((x,y)=>x[1]-y[1])[0],z=ZONES[zi];a.push(S.coins>=u[1]?'Доступно улучшение «'+u[0][1]+'»':'До улучшения «'+u[0][1]+'» ещё '+(u[1]-S.coins)+' монет');if(z.goal){a.push('До конца зоны осталось '+Math.max(0,z.goal-got)+' брёвен');if(zt<STT[zi])a.push('На звезду за скорость: '+Math.ceil(STT[zi]-zt)+' с')}const next=LV.find(v=>v>S.total);if(next)a.push('До роста ядра '+(next-S.total)+' брёвен');for(const [id,name,target]of DQ)if(!S.dq.r[id])a.push('Задание: '+name+' ('+Math.min(S.dq.p[id],target)+'/'+target+')');return a[Math.floor(now/4800)%a.length]}
function loop(now){const dt=Math.min(.033,(now-t0)/1000||.016);t0=now;if(!$('modal').classList.contains('show')&&!$('victory').classList.contains('show'))step(dt);draw(now);requestAnimationFrame(loop)}
function fit(){const w=$('wrap'),s=Math.min(w.clientWidth/W,w.clientHeight/H);if(!Number.isFinite(s)||s<=0)return;const d=Math.min(3,window.devicePixelRatio||1);cv.style.width=W*s+'px';cv.style.height=H*s+'px';const width=Math.max(1,Math.round(W*s*d)),height=Math.max(1,Math.round(H*s*d));if(cv.width!==width||cv.height!==height){cv.width=width;cv.height=height}cx.setTransform(width/W,0,0,height/H,0,0)}
window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe($('wrap'));
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{if(demo){enter(zi);return}const p=pt(e);cv.setPointerCapture(e.pointerId);if(tool==='chop'){const t=trees.find(t=>Math.abs(t.x-p.x)<38&&p.y<138);if(t)chop(t);return}if(tool==='erase'){let best=-1,dist=24;pieces.forEach((q,i)=>{const dx=q.bx-q.ax,dy=q.by-q.ay,L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,((p.x-q.ax)*dx+(p.y-q.ay)*dy)/L)):0;const d=Math.hypot(p.x-q.ax-t*dx,p.y-q.ay-t*dy);if(d<dist){dist=d;best=i}});if(best>=0){pieces.splice(best,1);beep(180)}return}if(ch>=0&&CH[ch].ban===tool){toast('В этой задаче эта деталь запрещена.');return}if(pieces.length>=maxP()){toast('Лимит деталей. Удали лишнюю или улучши мастерскую.');return}drag={k:tool,ax:p.x,ay:p.y,bx:p.x,by:p.y}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),limit=drag.k==='bounce'?55:drag.k==='fan'?50:120,dx=p.x-drag.ax,dy=p.y-drag.ay,d=Math.hypot(dx,dy)||1,k=Math.min(1,limit/d);drag.bx=drag.ax+dx*k;drag.by=drag.ay+dy*k});
cv.addEventListener('pointerup',()=>{if(drag&&Math.hypot(drag.bx-drag.ax,drag.by-drag.ay)>14){pieces.push(drag);used++;S.tut=1;beep(240)}drag=null});cv.addEventListener('pointercancel',()=>{drag=null});
const TOOL_HINTS={chop:'🪓 Нажимай на деревья, чтобы рубить',ramp:'🪵 Проведи пальцем, чтобы построить горку',bounce:'🟣 Начерти упругую платформу для брёвен',dam:'💧 Начерти плотину, затем открой её кнопкой',fan:'💨 Проведи линию в направлении ветра',erase:'🧽 Нажми на деталь, чтобы удалить её'};
$('tools').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tool=b.dataset.t;$('toolhint').textContent=TOOL_HINTS[tool];for(const x of $('tools').children){const selected=x===b;x.classList.toggle('on',selected);x.setAttribute('aria-pressed',selected?'true':'false')}});$('rel').onclick=()=>{damT=1.6;shake=.25;beep(65,'sawtooth',.5,.08)};
const ACH=[['t100','Сто брёвен',()=>S.total>=100],['t1000','Тысяча брёвен',()=>S.total>=1000],['c10','Комбо ×10',()=>S.maxC>=36],['st3','Три звезды в зоне',()=>Object.values(S.stars).some(v=>v===3)],['rich','Тысяча монет',()=>S.coins>=1000]];
function menu(){const t=menu.tab||'z';let h='<h2>🌲 Бревнопад</h2><div class="row tabs">'+[['z','Зоны'],['u','Прокачка'],['l','Одежда'],['c','Задачи'],['m','Ещё']].map(a=>'<button data-tab="'+a[0]+'"'+(t===a[0]?' class="on"':'')+'>'+a[1]+'</button>').join('')+'</div>';
if(t==='z')ZONES.forEach((z,i)=>{const ok=i<S.unlocked,r=S.rec[i];h+='<div class="row"><button data-z="'+i+'"'+(ok?'':' disabled')+'>'+z.n+' '+'★'.repeat(S.stars[i]||0)+'<small>'+(z.goal?'Цель: '+z.goal+' брёвен, деталей: '+z.pc:'Свободная игра')+(ok?'':' · закрыто')+(r?' · рекорд: '+r.t+' с, '+r.p+' дет.':'')+'</small><small>'+ZH[i]+'</small></button></div>'});
if(t==='u'){h+='<h3>Монеты: '+Math.floor(S.coins)+'</h3>';UP.forEach(u=>{const price=cost(u);h+='<div class="row"><button data-u="'+u[0]+'"'+(S.coins>=price?'':' disabled')+'>'+u[1]+' · ур. '+S.up[u[0]]+'<small>'+u[2]+' · '+price+' монет</small></button></div>'})}
if(t==='l'){const add=(arr,k)=>arr.forEach(o=>{const owned=S.own[o.id],worn=S.wear[k]===o.id;h+='<div class="row"><button data-w="'+k+':'+o.id+'"'+(owned||S.coins>=o.cost?'':' disabled')+(worn?' class="on"':'')+'>'+o.n+'<small>'+(worn?'Надето':owned?'Нажми, чтобы надеть':o.cost+' монет')+'</small></button></div>'});h+='<h3>Монеты: '+Math.floor(S.coins)+'</h3><h3>Одежда</h3>';add(OUTFIT,'o');h+='<h3>Шапки</h3>';add(HATS,'h')}
if(t==='c')CH.forEach((c,i)=>{const open=c.z<S.unlocked;h+='<div class="row"><button data-c="'+i+'" style="flex:4"'+(open?'':' disabled')+'>'+(S.chDone[i]?'✅ ':'')+chText(c)+'<small>Награда: '+c.r+' монет'+(open?'':' · ещё закрыто')+'</small></button><button data-r="'+i+'"'+(open?'':' disabled')+' title="Показать схему">▶</button></div>'});
if(t==='m'){h+='<h3>Задания дня (+30 монет)</h3>';for(const [id,name,n]of DQ)h+='<div class="row"><small>'+(S.dq.r[id]?'✅ ':'⬜ ')+name+' · '+Math.min(S.dq.p[id],n)+'/'+n+'</small></div>';h+='<h3>Настройки</h3><div class="row"><button data-s="snd">Звук: '+(S.snd?'вкл':'выкл')+'</button><button data-s="mus">Музыка: '+(S.mus?'вкл':'выкл')+'</button></div><div class="row"><button data-s="easy">Лёгкий режим: '+(S.easy?'вкл':'выкл')+'</button></div><h3>Достижения</h3>';for(const a of ACH)h+='<div class="row"><small>'+(S.ach.includes(a[0])?'✅ ':'🔒 ')+a[1]+'</small></div>';h+='<div class="row"><button data-s="reset">'+(menu.rs?'Подтвердить сброс ВСЕГО прогресса?':'Сбросить прогресс')+'</button></div>'}
h+='<div class="row"><button id="close">Вернуться в игру</button></div>';$('box').innerHTML=h;$('modal').classList.add('show')}
$('menu').onclick=menu;
$('box').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='close'){menu.rs=0;$('modal').classList.remove('show');return}if(b.dataset.tab){menu.tab=b.dataset.tab;menu();return}if(b.dataset.w){const[k,id]=b.dataset.w.split(':'),it=(k==='o'?OUTFIT:HATS).find(x=>x.id===id);if(!it)return;if(!S.own[id]){if(S.coins<it.cost)return;S.coins-=it.cost;S.own[id]=1}S.wear[k]=id;save();menu();return}if(b.dataset.s){const k=b.dataset.s;if(k==='reset'){if(menu.rs){try{localStorage.removeItem('brevnopad1')}catch(e){}location.reload();return}menu.rs=1}else{S[k]=!S[k];if(S.snd||S.mus)wakeAudio()}save();menu();return}if(b.dataset.c!==undefined){startCh(+b.dataset.c);$('modal').classList.remove('show');return}if(b.dataset.r!==undefined){startDemo(+b.dataset.r);$('modal').classList.remove('show');return}if(b.dataset.z!==undefined){const i=+b.dataset.z;if(i<S.unlocked)enter(i);$('modal').classList.remove('show');return}if(b.dataset.u){const u=UP.find(x=>x[0]===b.dataset.u);if(!u)return;const price=cost(u);if(S.coins>=price){S.coins-=price;S.up[u[0]]++;save();menu()}}});
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'){$('modal').classList.remove('show');menu.rs=0}});
const day=new Date().toLocaleDateString('sv-SE');if(S.gift&&S.gift!==day){S.coins+=50;setTimeout(()=>toast('Подарок дня: +50 монет!'),850)}S.gift=day;if(S.dq.d!==day)S.dq={d:day,p:{logs:0,gold:0,combo:0},r:{}};save();
setInterval(()=>{let updated=false;for(const a of ACH)if(!S.ach.includes(a[0])&&a[2]()){S.ach.push(a[0]);toast('Достижение: '+a[1]);updated=true}if(updated)save()},1000);
document.addEventListener('pointerdown',()=>{wakeAudio();music()},{once:true});window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});setInterval(save,5000);enter(0);fit();requestAnimationFrame(loop);
</script></body></html>
