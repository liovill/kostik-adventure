<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Костик: Волшебный мир</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(#8cdbff,#d6f8ff);color:#183d62;text-align:center}header{padding:15px 8px;font-size:clamp(18px,5vw,28px);font-weight:900}.score{font-size:19px;margin-bottom:9px}.world{margin:0 auto;width:min(96vw,650px);background:#84cc77;border:6px solid #e5ffd8;border-radius:26px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;box-shadow:0 8px 20px #2475a044}.place{border:3px solid white;border-radius:22px;min-height:142px;padding:12px 4px;background:#fff8;box-shadow:0 5px 0 #4d986a;cursor:pointer;color:#21446b;font-weight:800;font-size:17px}.place .emoji{display:block;font-size:54px}.place:active{transform:translateY(3px)}.hero{font-size:23px;padding:12px}.hint{padding:8px 15px;font-size:15px}.modal{position:fixed;inset:0;background:#143657b8;display:none;align-items:center;justify-content:center;padding:15px}.panel{background:white;border-radius:25px;width:min(100%,460px);padding:22px;max-height:90vh;overflow:auto}.panel h2{margin:4px}.panel p{font-size:20px}.answers{display:grid;gap:10px}button{font-family:inherit;touch-action:manipulation}.answers button,.back{border:0;background:#d8f1ff;border-radius:15px;padding:14px;font-size:19px;font-weight:700;color:#183d62}.back{margin-top:15px;background:#ffdc66}.status{font-size:14px;padding:12px}</style></head><body><a href="../" style="display:inline-block;margin:12px auto 0;padding:10px 18px;background:#fff;border-radius:14px;color:#183d62;font-weight:800;text-decoration:none">🏠 Все игры</a>
<header>🌟 КОСТИК: ВОЛШЕБНЫЙ МИР</header><div class="score" id="score">⭐ 0 звёздочек</div>
<main class="world"><button class="place" data-zone="0"><span class="emoji">🏰</span>Волшебный замок</button><button class="place" data-zone="1"><span class="emoji">🐉</span>Драконий лес</button><button class="place" data-zone="2"><span class="emoji">🏎️</span>Гоночный город</button><button class="place" data-zone="3"><span class="emoji">🚀</span>Космодром</button></main>
<div class="hero">🧒🏻 Костик и 👶🏼 Кирилл ждут приключений!</div><div class="hint">Нажми на любую территорию, чтобы начать приключение.</div><div class="status" id="status">Игра готова! 🎮</div>
<div class="modal" id="modal"><section class="panel"><h2 id="title"></h2><p id="question"></p><div class="answers" id="answers"></div><button class="back" id="back">Вернуться на карту</button></section></div>
<script>
(function(){
var zones=[
{name:"🏰 Волшебный замок",questions:[["Сколько углов у треугольника? 🔺","3",["2","3","4"]],["Какого цвета солнышко? ☀️","Жёлтого",["Синего","Жёлтого","Зелёного"]]]},
{name:"🐉 Драконий лес",questions:[["Что растёт в лесу? 🌲","Деревья",["Ракеты","Деревья","Машины"]],["Кто умеет летать? 🦋","Бабочка",["Рыбка","Бабочка","Черепаха"]]]},
{name:"🏎️ Гоночный город",questions:[["На какой свет можно ехать? 🚦","Зелёный",["Красный","Жёлтый","Зелёный"]],["Сколько колёс у обычной машины? 🚗","4",["2","4","6"]]]},
{name:"🚀 Космодром",questions:[["На чём летят в космос?","Ракета",["Лодка","Ракета","Поезд"]],["Что светит днём? ☀️","Солнце",["Луна","Фонарик","Солнце"]]]}
];
var stars=0;try{stars=Number(localStorage.getItem("kostik_new_stars")||0)||0}catch(e){}
var indices=[0,0,0,0],current=0,modal=document.getElementById("modal"),answers=document.getElementById("answers");
function update(){document.getElementById("score").textContent="⭐ "+stars+" звёздочек"}
function show(title,question,opts){document.getElementById("title").textContent=title;document.getElementById("question").textContent=question;answers.innerHTML="";opts.forEach(function(o){var b=document.createElement("button");b.textContent=o[0];b.onclick=o[1];answers.appendChild(b)});modal.style.display="flex"}
function close(){modal.style.display="none"}
function play(i){current=i;var z=zones[i],q=z.questions[indices[i]%z.questions.length];show(z.name,q[0],q[2].map(function(answer){return [answer,function(){if(answer===q[1]){stars++;indices[i]++;try{localStorage.setItem("kostik_new_stars",stars)}catch(e){}update();show("🎉 Молодец, Костик!","Ты получил звёздочку! ⭐",[["Следующее задание",function(){play(i)}],["На карту",close]])}else{show("💛 Попробуем ещё!","Выбери другой ответ.",[["Попробовать снова",function(){play(i)}]])}}]}))}
Array.prototype.forEach.call(document.querySelectorAll("[data-zone]"),function(b){b.onclick=function(){play(Number(b.getAttribute("data-zone")))}});document.getElementById("back").onclick=close;update();document.getElementById("status").textContent="Выбери приключение! Всё готово. ✓";
})();
</script></body></html>
