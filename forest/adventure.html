<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b4d"><title>Зачарованный лес • Князь и Кудрявый</title><style>*{box-sizing:border-box}body{margin:0;background:#152846;color:#fff8df;font:17px system-ui,sans-serif}main{max-width:660px;margin:auto;padding:12px 12px 32px}a{color:#ffe18a}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.pill{background:#ffffff24;border:1px solid #ffffff4a;border-radius:30px;padding:8px 12px}h1{font-size:clamp(24px,7vw,34px);text-align:center;margin:10px 0}p{margin:8px 0}button{font:inherit;border:0;border-radius:17px;background:#ffcf66;color:#312047;font-weight:800;padding:12px 18px;min-height:52px;touch-action:manipulation}button:active{transform:scale(.96)}button:disabled{opacity:.45}.scene{position:relative;width:100%;aspect-ratio:4/5;max-height:68dvh;overflow:hidden;border:4px solid #94d6a5;border-radius:24px;background:linear-gradient(#79bce9 0 29%,#bce9b3 29% 42%,#5aa766 42% 100%);box-shadow:0 12px 35px #091b30}.scene:before{content:"";position:absolute;inset:42% 0 0;background:repeating-linear-gradient(120deg,transparent 0 55px,#ffffff0a 55px 60px);pointer-events:none}.mountains{position:absolute;top:15%;left:0;width:100%;font-size:clamp(40px,10vw,85px);letter-spacing:22px;opacity:.7;white-space:nowrap}.path{position:absolute;left:27%;width:46%;top:40%;height:70%;background:#e8c68b;clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);opacity:.86}.decor{position:absolute;font-size:clamp(32px,9vw,68px);filter:drop-shadow(0 6px 3px #1d553b88);pointer-events:none}.hero{position:absolute;z-index:5;font-size:clamp(54px,16vw,94px);width:24%;text-align:center;transform:translate(-50%,-58%);filter:drop-shadow(0 7px 2px #183d3888);transition:left .12s linear,top .12s linear}.hero small{display:block;font-size:12px;background:#263b6bdf;border-radius:12px;padding:3px}.object{position:absolute;z-index:4;transform:translate(-50%,-50%);font-size:clamp(37px,10vw,65px);border:0;background:none;box-shadow:none;padding:4px;min-height:48px;min-width:48px}.object.done{opacity:.45}.object.gate{font-size:clamp(52px,13vw,82px)}.hud{position:absolute;left:10px;top:10px;background:#183b58d9;border-radius:14px;padding:7px 12px;font-weight:800;z-index:8}.dialog{background:#283e65;border:2px solid #9bbae1;border-radius:18px;padding:13px;margin-top:12px;min-height:92px}.dialog strong{color:#ffe19c}.controls{display:grid;grid-template-columns:repeat(3,70px);grid-template-rows:repeat(2,60px);gap:8px;justify-content:center;margin-top:12px}.controls button{padding:6px;font-size:25px;touch-action:none;background:#d9e8ff}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.modal{position:fixed;inset:0;background:#0c1935df;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.modal.hidden{display:none}.sheet{background:#34477c;border:2px solid #b6d3f9;border-radius:24px;padding:22px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 70px #0008}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.answers button{font-size:clamp(30px,9vw,54px);min-height:86px;padding:8px;background:#fff1bb}.hint{font-size:14px;color:#d9e9ff;text-align:center}#feedback{min-height:25px;color:#ffe39d;font-weight:700}.celebrate{font-size:54px}@media(max-width:390px){.controls{grid-template-columns:repeat(3,62px);grid-template-rows:repeat(2,54px)}.scene{max-height:60dvh}}@media(prefers-reduced-motion:reduce){.hero{transition:none}}</style></head><body><main><header><a href="./">← Академия</a><span class="pill" id="heroName"></span></header><h1>🌲 Зачарованный лес</h1><div class="scene" id="scene"><div class="mountains">⛰️ 🌤️ ⛰️</div><div class="path"></div><div class="decor" style="left:0;top:30%">🌳</div><div class="decor" style="right:0;top:32%">🌲</div><div class="decor" style="left:4%;top:59%">🌲</div><div class="decor" style="right:1%;top:65%">🌳</div><div class="decor" style="left:0;bottom:1%">🌼</div><div class="decor" style="right:2%;bottom:3%">🍄</div><div class="hud" id="hud">💎 0 / 3</div><button class="object gate" id="gate" style="left:50%;top:24%" aria-label="Волшебные ворота">🏰</button><button class="object" id="rune0" style="left:24%;top:47%" aria-label="Первый кристалл">💎</button><button class="object" id="rune1" style="left:76%;top:61%" aria-label="Второй кристалл">💎</button><button class="object" id="rune2" style="left:35%;top:80%" aria-label="Третий кристалл">💎</button><div class="hero" id="hero"><span id="heroEmoji">🧙‍♂️</span><small id="heroLabel">Костя</small></div></div><div class="dialog" aria-live="polite"><strong id="speaker">🧙‍♂️ Звездочёт</strong><p id="story">Волшебные ворота закрыты! Найди три кристалла и выполни задания.</p></div><div class="controls"><button class="up" data-dir="up" aria-label="Вверх">▲</button><button class="left" data-dir="left" aria-label="Влево">◀</button><button class="down" data-dir="down" aria-label="Вниз">▼</button><button class="right" data-dir="right" aria-label="Вправо">▶</button></div><div class="actions"><button id="interact">✨ Исследовать</button><button id="reset">↻ Новая прогулка</button></div><p class="hint">Двигай героя стрелками. Подойди к кристаллу и нажми «Исследовать». Можно нажимать и на сами предметы.</p></main><div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="question"><div class="sheet"><div class="celebrate" id="modalEmoji">🔮</div><h2 id="question">Волшебный вопрос</h2><div class="answers" id="answers"></div><p id="feedback" aria-live="polite"></p><button id="closeModal">← Вернуться в лес</button></div></div><script>
const $=id=>document.getElementById(id);const who=localStorage.getItem('academy-active-hero')==='kirill'?'kirill':'kostya';const name=who==='kirill'?'Кирилл':'Костя';$('heroName').textContent='✨ '+name;$('heroLabel').textContent=name;$('heroEmoji').textContent=who==='kirill'?'👶🏼':'🧙‍♂️';const key='academy-forest-'+who;let completed=JSON.parse(localStorage.getItem(key)||'[false,false,false]');if(!Array.isArray(completed)||completed.length!==3)completed=[false,false,false];let pos={x:50,y:91},active=-1;const objects=[{x:24,y:47},{x:76,y:61},{x:35,y:80}],gate={x:50,y:24};const tasks=who==='kirill'?[{q:'Где красный цвет?',a:'🔴',options:['🔵','🔴','🟢']},{q:'Найди кошечку!',a:'🐱',options:['🐶','🐱','🐻']},{q:'Где круг?',a:'🟡',options:['🔺','🟦','🟡']}]:[{q:'Сколько будет 2 + 3?',a:'5',options:['4','5','6']},{q:'С какой буквы начинается слово «ДОМ»?',a:'Д',options:['Б','Д','М']},{q:'Что продолжит ряд: 🔴 🔵 🔴 🔵 ?',a:'🔴',options:['🟢','🔵','🔴']}];function tell(t,by='🧙‍♂️ Звездочёт'){$('speaker').textContent=by;$('story').textContent=t}function draw(){$('hero').style.left=pos.x+'%';$('hero').style.top=pos.y+'%';completed.forEach((v,i)=>{$('rune'+i).classList.toggle('done',v);$('rune'+i).textContent=v?'✨':'💎'});$('hud').textContent='💎 '+completed.filter(Boolean).length+' / 3';$('gate').textContent=completed.every(Boolean)?'🏰✨':'🏰'}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function move(dx,dy){if(!$('modal').classList.contains('hidden'))return;pos.x=Math.max(11,Math.min(89,pos.x+dx));pos.y=Math.max(34,Math.min(92,pos.y+dy));draw();let near=objects.findIndex((o,i)=>!completed[i]&&dist(pos,o)<12);if(near>=0)tell('Кристалл рядом! Нажми «Исследовать», чтобы разгадать загадку.','✨ Волшебный кристалл');else if(dist(pos,gate)<15)tell(completed.every(Boolean)?'Все кристаллы собраны! Открой ворота.':'Чтобы открыть ворота, нужны три кристалла.','🏰 Ворота')}function interact(){let near=objects.map((o,i)=>({i,d:dist(pos,o)})).filter(o=>!completed[o.i]).sort((a,b)=>a.d-b.d)[0];if(near&&near.d<15){ask(near.i);return}if(dist(pos,gate)<18){if(completed.every(Boolean))finish();else tell('Собери все три кристалла, тогда ворота откроются.','🏰 Ворота');return}tell('Подойди поближе к кристаллу или к воротам.','🧙‍♂️ Звездочёт')}function ask(i){if(completed[i]){tell('Этот кристалл уже твой!');return}active=i;$('modalEmoji').textContent='💎';$('question').textContent=tasks[i].q;$('feedback').textContent='';$('answers').innerHTML='';tasks[i].options.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(active<0)return;if(v===tasks[active].a){completed[active]=true;localStorage.setItem(key,JSON.stringify(completed));$('feedback').textContent='🎉 Верно! Кристалл твой!';$('modalEmoji').textContent='🌟';$('answers').querySelectorAll('button').forEach(x=>x.disabled=true);draw();tell(completed.every(Boolean)?'Ты собрал все кристаллы! Иди к воротам!':'Отлично! Найди следующий кристалл.', '✨ '+name)}else $('feedback').textContent='Попробуй ещё, у тебя получится!'};$('answers').appendChild(b)});$('modal').classList.remove('hidden')}function finish(){$('modal').classList.remove('hidden');active=-1;$('modalEmoji').textContent='🐲🏰';$('question').textContent='Ура, '+name+'! Ворота Академии открыты!';$('answers').innerHTML='';$('feedback').textContent='Первая миссия пройдена! Новые приключения впереди.';localStorage.setItem('academy-forest-finished-'+who,'yes');tell('Миссия завершена! Академия благодарит тебя.','🏰 Академия')}function close(){$('modal').classList.add('hidden');active=-1}$('closeModal').onclick=close;$('interact').onclick=interact;$('reset').onclick=()=>{completed=[false,false,false];localStorage.setItem(key,JSON.stringify(completed));pos={x:50,y:91};draw();tell('Новая прогулка! Найди три кристалла и открой ворота.')};objects.forEach((o,i)=>{$('rune'+i).onclick=()=>{if(dist(pos,o)<17)ask(i);else tell('Подойди к кристаллу поближе!')}});$('gate').onclick=()=>{if(dist(pos,gate)<18)interact();else tell('Сначала подойди к воротам!')};const dirs={up:[0,-4],down:[0,4],left:[-5,0],right:[5,0]};document.querySelectorAll('[data-dir]').forEach(b=>{let interval;const act=()=>move(...dirs[b.dataset.dir]);b.addEventListener('pointerdown',e=>{e.preventDefault();act();interval=setInterval(act,140)});const stop=()=>{clearInterval(interval);interval=null};b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop)});document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};if(map[e.key]){e.preventDefault();move(...dirs[map[e.key]])}if(e.key==='Escape')close()});draw();if(completed.every(Boolean))tell('Все кристаллы уже найдены! Подойди к воротам, чтобы завершить миссию.');</script></body></html>
