<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#24144a"><title>Академия Костика • Волшебная школа</title><style>*{box-sizing:border-box}body{margin:0;font:18px system-ui,sans-serif;color:#fff5d8;background:radial-gradient(circle at 50% 0,#67439a,#261547 70%);min-height:100dvh}main{max-width:720px;margin:auto;padding:calc(15px + env(safe-area-inset-top)) 15px 40px}header{display:flex;justify-content:space-between;align-items:center}button,a{font:inherit;cursor:pointer}button{border:0;border-radius:18px;padding:13px 17px;background:#ffcf64;color:#34214d;font-weight:800;box-shadow:0 5px 0 #bd853a}button:active{transform:translateY(3px);box-shadow:0 2px 0 #bd853a}button:disabled{opacity:.5}a{color:#ffdc8b}h1{font-size:clamp(29px,8vw,48px);margin:14px 0 4px;text-align:center;text-shadow:0 3px #160c2e}h2{font-size:26px;margin:12px 0}.sub{text-align:center;color:#e7d5ff}.castle{text-align:center;font-size:clamp(65px,20vw,115px);filter:drop-shadow(0 9px 15px #110826)}.stars{text-align:center;font-size:24px;color:#ffd56e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:138px;background:linear-gradient(150deg,#7355b0,#463071);color:white;border:2px solid #c7a6ff;box-shadow:0 6px 0 #1b1136;padding:14px 8px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px}.tile .emoji{font-size:44px}.tile small{font-size:13px;color:#e6d5ff}.panel{background:#ffffff15;border:2px solid #ffffff32;border-radius:24px;padding:18px;margin-top:16px;box-shadow:0 10px 35px #11092055}.hidden{display:none!important}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.prompt{font-size:24px;font-weight:800;text-align:center;margin:12px 0 16px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.answers button{font-size:27px;min-height:85px;background:#fff2d3}.message{min-height:38px;text-align:center;font-weight:700;color:#fff1a5;margin:12px 0}.canvasbox{position:relative;background:#fffdf4;border:5px solid #e9c776;border-radius:20px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:290px;touch-action:none}.hint{color:#e8d9ff;text-align:center;font-size:15px}.progress{height:12px;border-radius:20px;background:#130b2d;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:#f9d16b;width:0;transition:width .3s}.tag{background:#ffffff24;border-radius:20px;padding:8px 12px}.note{font-size:14px;color:#dccdf6}select{padding:10px;border-radius:12px;font:inherit}#back{background:#d9c6ff;box-shadow:0 5px 0 #8c71bc}.full{width:100%;margin-top:10px}.sound{background:#d9c6ff;box-shadow:0 5px 0 #8c71bc}</style></head><body><main><header><a href="../">⌂ Главная</a><button class="sound" id="sound">🔊 Звук</button></header><section id="home"><div class="castle">🌙🏰✨</div><h1>Академия Костика</h1><p class="sub">Волшебная школа знаний • от дошкольника до 2 класса</p><div class="stars" id="stars">⭐ 0 звёзд</div><div class="panel"><div class="row between"><strong>Выбери ступень</strong><select id="grade"><option value="0">🌱 Дошкольник</option><option value="1">📘 1 класс</option><option value="2">📗 2 класс</option></select></div><p class="note">Начинай с простого. Можно выбрать любой класс, чтобы попробовать.</p><div class="grid"><button class="tile" data-game="shape"><span class="emoji">📐</span>Башня фигур<small>Рисуй пальцем</small></button><button class="tile" data-game="math"><span class="emoji">🧮</span>Башня чисел<small>Счёт и задачи</small></button><button class="tile" data-game="letters"><span class="emoji">🔤</span>Башня букв<small>Звуки и слова</small></button><button class="tile" data-game="world"><span class="emoji">🌿</span>Башня природы<small>Окружающий мир</small></button><button class="tile" data-game="memory"><span class="emoji">🧠</span>Башня памяти<small>Запоминай и находи</small></button><button class="tile" data-game="music"><span class="emoji">🎵</span>Башня музыки<small>Повтори мелодию</small></button></div></div><p class="hint">Без таймера • С подсказками • Сохраняет звёзды на устройстве</p></section><section id="play" class="hidden"><div class="row between"><button id="back">← В замок</button><span class="tag" id="step">1 / 5</span></div><div class="progress"><span id="bar"></span></div><div class="panel"><h2 id="gameTitle"></h2><p class="prompt" id="prompt"></p><div id="area"></div><div class="message" id="message" aria-live="polite"></div><div class="row between"><button id="repeat" class="sound">🔉 Повтори</button><button id="next" class="hidden">Дальше ✨</button></div></div></section></main><script>
const $=id=>document.getElementById(id),home=$('home'),play=$('play'),area=$('area');let sound=true,ctxAudio,game='',level=0,step=0,solved=false,stars=Number(localStorage.getItem('academy-stars')||0),current={},sequence=[],seqIndex=0;const names={shape:'📐 Башня фигур',math:'🧮 Башня чисел',letters:'🔤 Башня букв',world:'🌿 Башня природы',memory:'🧠 Башня памяти',music:'🎵 Башня музыки'};function beep(freq=520,dur=.16){if(!sound)return;try{ctxAudio=ctxAudio||new(window.AudioContext||window.webkitAudioContext)();let o=ctxAudio.createOscillator(),g=ctxAudio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.08,ctxAudio.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctxAudio.currentTime+dur);o.connect(g);g.connect(ctxAudio.destination);o.start();o.stop(ctxAudio.currentTime+dur)}catch(e){}}function speak(t){if(!sound||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.83;u.pitch=1.08;window.speechSynthesis.speak(u)}function updateStars(){$('stars').textContent='⭐ '+stars+' звёзд'}updateStars();$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Звук':'🔇 Без звука';if(sound)beep()};$('back').onclick=()=>{play.classList.add('hidden');home.classList.remove('hidden');window.speechSynthesis&&window.speechSynthesis.cancel()};$('repeat').onclick=()=>speak($('prompt').textContent);$('next').onclick=()=>{step++;if(step>=5){area.innerHTML='<div style="text-align:center;font-size:72px">🏆✨</div><p class="prompt">Башня пройдена! Ты молодец!</p><button class="full" id="again">Ещё приключение</button>'; $('prompt').textContent='Победа!';$('next').classList.add('hidden');$('again').onclick=()=>{step=0;render()};speak('Ура! Ты прошёл башню!');return}render()};document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;level=Number($('grade').value);step=0;home.classList.add('hidden');play.classList.remove('hidden');render()});function win(){if(solved)return;solved=true;stars++;localStorage.setItem('academy-stars',stars);updateStars();$('message').textContent='✨ Отлично! Получена звезда!';$('next').classList.remove('hidden');beep(740,.25);setTimeout(()=>beep(980,.3),160);speak('Молодец! Получай звезду!')}function render(){solved=false;$('gameTitle').textContent=names[game];$('step').textContent=(step+1)+' / 5';$('bar').style.width=(step/5*100)+'%';$('next').classList.add('hidden');$('message').textContent='';area.innerHTML='';({shape:shapeTask,math:mathTask,letters:letterTask,world:worldTask,memory:memoryTask,music:musicTask})[game]();setTimeout(()=>{if(!$('prompt'))return;speak(game==='letters'&&level===0?letters[step][1]+'. '+$('prompt').textContent:$('prompt').textContent)},250)}function answerButtons(options,correct){let d=document.createElement('div');d.className='answers';options.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(solved)return;if(i===correct)win();else{$('message').textContent='Попробуй ещё! 🌟';beep(230,.12);speak('Попробуй ещё')}};d.appendChild(b)});area.appendChild(d)}function shuffle(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function mathTask(){let a,b,op='+',result;if(level===0){a=1+step%5;b=1+(step*2)%4}else if(level===1){a=4+step*2;b=2+step;op=step%2?'-':'+'}else{a=16+step*11;b=3+step*4;op=step%2?'-':'+'}result=op==='+'?a+b:a-b;$('prompt').textContent='Сколько будет '+a+' '+(op==='+'?'плюс':'минус')+' '+b+'?';if(level===0){let fruits=document.createElement('p');fruits.style='text-align:center;font-size:31px;word-break:break-word';fruits.textContent='🍎'.repeat(a)+'  +  '+'🍐'.repeat(b);area.appendChild(fruits)}let opts=shuffle([...new Set([result,result+1,result+2,Math.max(0,result-1)])]);while(opts.length<4)opts.push(result+opts.length+2);answerButtons(opts,opts.indexOf(result))}const letters=[['А','арбуз','🍉'],['М','мяч','⚽'],['К','кот','🐈'],['С','солнце','☀️'],['Д','дом','🏠']];function letterTask(){let [l,w,em]=letters[step];if(level===0){$('prompt').textContent='Посмотри на картинку. С какой буквы начинается её название?';area.innerHTML='<p style="font-size:85px;text-align:center" aria-label="Изображение">'+em+'</p><button class="full sound" id="wordAudio">🔊 Послушать слово</button>';$('wordAudio').onclick=()=>speak(w);let opts=shuffle([l,'О','Р','Т']);answerButtons(opts,opts.indexOf(l))}else{let words=level===1?[w,'рыба','луна','сок']:[w,'трава','река','книга'];$('prompt').textContent='Найди слово «'+w+'»';let opts=shuffle(words);answerButtons(opts,opts.indexOf(w))}}const worlds=[[['Кто живёт в лесу?','🦊','🐠','🐪','🐧']],[['Что нужно растению для роста?','💧','🧸','🚗','📺']],[['Какая планета наш дом?','🌍','🪐','☀️','🌙']]];function worldTask(){let tasks=[['Что растёт на дереве?','🍎','🚗','🧸','👟'],['Кто умеет летать?','🐦','🐟','🐢','🐌'],['Что бывает зимой?','❄️','🌻','🍓','🍂'],['Что нужно растению?','💧','🧱','📺','🛼'],['Какой транспорт едет по дороге?','🚙','🚀','🚢','🛶']];if(level===1)tasks=[['Какая часть растения под землёй?','Корень','Лист','Цветок','Плод'],['Когда распускаются почки?','Весной','Зимой','Ночью','Осенью'],['Кто относится к насекомым?','Бабочка','Воробей','Кошка','Щука'],['Что показывает термометр?','Температуру','Время','Длину','Вес'],['Что нужно делать на красный свет?','Стоять','Бежать','Прыгать','Играть']];if(level===2)tasks=[['Что обозначает условный знак на карте?','Объект','Погоду','Время','Звук'],['В каком состоянии бывает вода?','Твёрдом','Деревянном','Бумажном','Тканевом'],['Как называется движение Земли вокруг Солнца?','Обращение','Таяние','Испарение','Цветение'],['Каким прибором измеряют температуру?','Термометром','Линейкой','Весами','Часами'],['Что сохраняет природу?','Сортировка мусора','Мусор в лесу','Ломать ветки','Жечь траву']];let t=tasks[step],opts=shuffle(t.slice(1));$('prompt').textContent=t[0];answerButtons(opts,opts.indexOf(t[1]))}function simplify(points,eps){if(points.length<3)return points;let first=points[0],last=points[points.length-1],max=0,idx=0;for(let i=1;i<points.length-1;i++){let p=points[i],dx=last.x-first.x,dy=last.y-first.y,t=Math.max(0,Math.min(1,((p.x-first.x)*dx+(p.y-first.y)*dy)/(dx*dx+dy*dy||1))),d=Math.hypot(p.x-first.x-t*dx,p.y-first.y-t*dy);if(d>max){max=d;idx=i}}if(max>eps){let a=simplify(points.slice(0,idx+1),eps),b=simplify(points.slice(idx),eps);return a.slice(0,-1).concat(b)}return[first,last]}function inspectShape(strokes,shape){let all=strokes.flat();if(all.length<10)return'Нарисуй фигуру пальцем';let xs=all.map(p=>p.x),ys=all.map(p=>p.y),w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);if(w<55||h<55)return'Сделай рисунок покрупнее';let diag=Math.hypot(w,h),longest=strokes.reduce((a,b)=>a.length>b.length?a:b,[]);if(longest.length<8)return'Попробуй нарисовать одной линией';let p=longest.slice(),start=p[0],end=p[p.length-1],closed=Math.hypot(start.x-end.x,start.y-end.y)<diag*.22;if(!closed&&shape!=='домик')return'Соедини начало и конец фигуры';if(closed)p[p.length-1]={...start};let poly=simplify(p,diag*.065);if(closed&&poly.length>2&&Math.hypot(poly[0].x-poly[poly.length-1].x,poly[0].y-poly[poly.length-1].y)<diag*.12)poly.pop();let n=poly.length,ratio=w/h;if(shape==='круг'){if(n>6&&ratio>.65&&ratio<1.45)return null;return'У круга нет углов. Попробуй нарисовать круглее'}if(shape==='треугольник'){if(n===3)return null;return'У треугольника три угла. Попробуй ещё'}if(shape==='квадрат'||shape==='прямоугольник'){if(n!==4)return'Нужны четыре прямые стороны и четыре угла';let v=poly.map((q,i)=>({x:poly[(i+1)%4].x-q.x,y:poly[(i+1)%4].y-q.y})),lengths=v.map(q=>Math.hypot(q.x,q.y));let right=v.every((q,i)=>Math.abs(q.x*v[(i+1)%4].x+q.y*v[(i+1)%4].y)/(lengths[i]*lengths[(i+1)%4]||1)<.42);if(!right)return'Попробуй сделать углы прямыми';if(shape==='квадрат'){if(Math.max(...lengths)/Math.min(...lengths)<1.55)return null;return'У квадрата все стороны примерно равны'}if(Math.max(...lengths)/Math.min(...lengths)>1.35)return null;return'Прямоугольник должен быть вытянутым'}if(shape==='домик'){if(strokes.length>=2&&all.length>30)return null;return'Нарисуй стены и крышу домика'}return'Попробуй ещё'}function shapeTask(){let shape=['треугольник','квадрат','круг','домик','прямоугольник'][step];$('prompt').textContent='Нарисуй '+shape+' пальцем!';area.innerHTML='<div class="canvasbox"><canvas id="draw"></canvas></div><p class="hint">Нарисуй фигуру одной линией. Если трудно, нажми «Образец».</p><div class="row between"><button id="clear" class="sound">↺ Стереть</button><button id="example" class="sound">👁 Образец</button><button id="check">✨ Проверить</button></div>';let c=$('draw'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.round(r.width*dpr);c.height=Math.round(290*dpr);let ctx=c.getContext('2d');ctx.scale(dpr,dpr);let drawing=false,points=[],strokes=[];function clear(){ctx.fillStyle='#fffdf4';ctx.fillRect(0,0,r.width,290)}clear();ctx.strokeStyle='#7544a9';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';function pos(e){let b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*r.width/b.width,y:(e.clientY-b.top)*290/b.height}}c.onpointerdown=e=>{if(solved)return;c.setPointerCapture(e.pointerId);drawing=true;let p=pos(e);points=[p];ctx.beginPath();ctx.moveTo(p.x,p.y)};c.onpointermove=e=>{if(!drawing)return;let p=pos(e);points.push(p);ctx.lineTo(p.x,p.y);ctx.stroke()};c.onpointerup=()=>{if(drawing){drawing=false;strokes.push(points);points=[]}};$('clear').onclick=()=>{clear();strokes=[];$('message').textContent=''};$('example').onclick=()=>{let paths={треугольник:[[.5,.16],[.2,.78],[.8,.78],[.5,.16]],квадрат:[[.25,.2],[.75,.2],[.75,.8],[.25,.8],[.25,.2]],прямоугольник:[[.14,.27],[.86,.27],[.86,.73],[.14,.73],[.14,.27]],домик:[[.25,.48],[.5,.18],[.75,.48],[.75,.83],[.25,.83],[.25,.48]],круг:Array.from({length:49},(_,i)=>[.5+.29*Math.cos(i*Math.PI/24),.5+.34*Math.sin(i*Math.PI/24)])};clear();ctx.save();ctx.strokeStyle='#cbb8e2';ctx.setLineDash([8,9]);ctx.lineWidth=5;ctx.beginPath();paths[shape].forEach(([x,y],i)=>i?ctx.lineTo(x*r.width,y*290):ctx.moveTo(x*r.width,y*290));ctx.stroke();ctx.restore();strokes=[];$('message').textContent='Это образец. Обведи его пальцем'};$('check').onclick=()=>{let error=inspectShape(strokes,shape);if(error){$('message').textContent='🪄 '+error;speak(error)}else win()};$('message').textContent='Я проверю форму, а не только размер рисунка'} function memoryTask(){let symbols=['🌟','🦋','🌈','🐉','🍄','🔮'];let target=symbols[(step+level)%symbols.length];$('prompt').textContent='Запомни волшебный знак!';area.innerHTML='<div id="memorize" style="font-size:100px;text-align:center">'+target+'</div>';setTimeout(()=>{if(game!=='memory'||solved||!$('memorize'))return;$('memorize').remove();$('prompt').textContent='Какой знак ты видел?';let opts=shuffle([target,...shuffle(symbols.filter(x=>x!==target)).slice(0,3)]);answerButtons(opts,opts.indexOf(target));speak('Какой знак ты видел?')},level===0?3500:level===1?2500:1700)}function wavUrl(freqs,duration=.4){let rate=22050,gap=.13,note=Math.round(duration*rate),silence=Math.round(gap*rate),samples=freqs.length*(note+silence),bytes=44+samples*2,buffer=new ArrayBuffer(bytes),v=new DataView(buffer);function str(i,t){for(let j=0;j<t.length;j++)v.setUint8(i+j,t.charCodeAt(j))}str(0,'RIFF');v.setUint32(4,bytes-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,samples*2,true);for(let k=0;k<freqs.length;k++)for(let j=0;j<note;j++){let t=j/rate,fade=Math.min(1,j/(rate*.025),(note-j)/(rate*.08)),wave=Math.sin(2*Math.PI*freqs[k]*t)*.7+Math.sin(4*Math.PI*freqs[k]*t)*.2;v.setInt16(44+2*(k*(note+silence)+j),Math.round(wave*fade*12500),true)}let data=new Uint8Array(buffer),parts=[];for(let i=0;i<data.length;i+=8192)parts.push(String.fromCharCode(...data.subarray(i,i+8192)));return'data:audio/wav;base64,'+btoa(parts.join(''))}let musicPlayer=null;function musicTask(){let tones=[330,392,440,523,587];sequence=Array.from({length:level+2+(step>2?1:0)},(_,i)=>(step+i*2)%5);seqIndex=0;$('prompt').textContent='Послушай и повтори волшебную мелодию';area.innerHTML='<p class="hint">Нажми «Слушать». Услышишь ноты и увидишь подсветку. Затем повтори.</p><button class="full" id="listen">▶ Слушать мелодию</button><div class="answers" id="keys" style="margin-top:18px"></div><p class="hint">Если звука нет, проверь громкость мультимедиа и открой игру в Safari.</p>';let keys=[],urls=tones.map(t=>wavUrl([t],.35));tones.forEach((f,i)=>{let b=document.createElement('button');b.textContent=['🔴','🟠','🟡','🟢','🔵'][i];b.onclick=()=>{if(musicPlayer)musicPlayer.pause();musicPlayer=new Audio(urls[i]);musicPlayer.volume=1;musicPlayer.play().catch(()=>{$('message').textContent='Звук заблокирован браузером. Открой в Safari.'});if(i===sequence[seqIndex]){seqIndex++;$('message').textContent='Верно: '+seqIndex+' из '+sequence.length;if(seqIndex===sequence.length)win()}else{seqIndex=0;$('message').textContent='Попробуй ещё, слушай внимательно'}};$('keys').appendChild(b);keys.push(b)});$('listen').onclick=()=>{seqIndex=0;if(musicPlayer)musicPlayer.pause();musicPlayer=new Audio(wavUrl(sequence.map(v=>tones[v]),.43));musicPlayer.volume=1;musicPlayer.play().then(()=>{$('message').textContent='🎶 Слушай ноты!'}).catch(()=>{$('message').textContent='Не удалось включить звук. Попробуй открыть игру в Safari.'});sequence.forEach((v,i)=>setTimeout(()=>{if(game!=='music'||!keys[v])return;keys[v].style.background='#ffcc6b';setTimeout(()=>{if(keys[v])keys[v].style.background=''},420)},i*560))}};</script></body></html>
