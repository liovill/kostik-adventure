<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf7ff"><title>Академия Костика</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#dff6ff,#fff1cb);font:17px system-ui,sans-serif;color:#273c59;min-height:100dvh}main{max-width:680px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:8px}a{color:#36527c;text-decoration:none;background:#fff;padding:10px 14px;border-radius:14px;font-weight:700}h1{font-size:clamp(26px,7vw,38px);margin:18px 0 4px}p{line-height:1.45}.muted{color:#60708a}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{border:2px solid #ffffff;background:#fff;border-radius:22px;padding:20px 10px;box-shadow:0 5px 0 #c2dbe8;cursor:pointer;text-align:center;color:inherit;font:inherit}.tile b{display:block;font-size:19px;margin:8px 0}.tile .emoji{font-size:45px}.tile small{color:#687c8d}button:active{transform:translateY(3px)}.panel{background:white;border-radius:24px;padding:18px;margin-top:15px;box-shadow:0 6px 0 #c9dfeb}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.smallbtn{background:#e7f3ff;border:0;border-radius:12px;padding:10px 14px;color:#264867;font-weight:800}.meter{height:13px;border-radius:20px;background:#e7eaf0;overflow:hidden;margin:15px 0}.fill{height:100%;background:#6ac69c;width:0;transition:width .25s}.task{font-size:clamp(35px,10vw,60px);font-weight:900;text-align:center;margin:22px 0 10px;min-height:70px}.detail{text-align:center;color:#697b89;min-height:35px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.answer{border:2px solid #cde6ff;border-radius:18px;background:#f1f9ff;padding:17px 8px;font-size:29px;font-weight:900;color:#253e5e;min-height:72px}.answer.good{background:#baf0ce;border-color:#6ac69c}.answer.bad{background:#ffe3d9;border-color:#f2b6a4}.message{min-height:54px;font-weight:750;text-align:center;font-size:18px}.primary{width:100%;padding:15px;border:0;border-radius:17px;background:#ffd369;color:#423f35;font-weight:900;font-size:19px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.chip{border:2px solid #d4e6f3;background:#fff;border-radius:20px;padding:10px 14px;font-weight:800;color:#38506b}.chip.selected{background:#ffe49c;border-color:#eabf50}.stat{display:flex;justify-content:space-between;background:#ffffffaa;border-radius:15px;padding:12px;margin:12px 0}.badge{font-size:14px;font-weight:850;background:#fff5cd;border-radius:20px;padding:7px 10px}.summary{text-align:center;font-size:60px;margin:14px}footer{text-align:center;font-size:13px;color:#708195;padding:20px}@media(max-width:380px){.tile{padding:15px 5px}.answer{font-size:26px}}</style></head><body><main><header><a href="../">🏠 Игры</a><span class="badge" id="stars">⭐ 0</span></header><section id="home"><h1>🎒 Академия Костика</h1><p class="muted">Учимся играя! Выбери предмет, а затем уровень сложности.</p><div class="grid" id="subjects"></div><div class="stat"><span>🏆 Правильных ответов</span><b id="total">0</b></div><p class="muted">Задания короткие, без таймера и штрафов за ошибки. Можно заниматься по 5–10 минут.</p></section><section id="lesson" class="hidden"><div class="topline"><button class="smallbtn" id="back">← Предметы</button><span class="badge" id="lessonName"></span></div><div class="chips" id="levels"></div><div class="panel"><div class="topline"><b id="stepLabel">Задание 1 из 10</b><span id="correctLabel">⭐ 0</span></div><div class="meter"><div class="fill" id="fill"></div></div><div class="task" id="task"></div><div class="detail" id="detail"></div><div class="answers" id="answers"></div><div class="message" id="message" aria-live="polite"></div><button class="primary hidden" id="next">Дальше ➜</button></div></section><section id="finish" class="panel hidden"><div class="summary">🏆🌟</div><h1 style="text-align:center">Молодец, Костик!</h1><p id="result" style="text-align:center"></p><button class="primary" id="again">Ещё задания 🔄</button><button class="smallbtn" id="toHome" style="width:100%;margin-top:12px">Выбрать другой предмет</button></section><footer>Сделано для Костика 💛</footer></main><script>
(()=>{'use strict';const $=x=>document.getElementById(x),subjects=[['math','🔢','Математика','Сложение и вычитание'],['compare','⚖️','Сравнение','Больше, меньше, равно'],['logic','🧩','Логика','Закономерности и ряды'],['letters','🔤','Буквы','Алфавит и звуки'],['attention','👀','Внимание','Найди лишнее'],['memory','🧠','Память','Запомни последовательность']];let type='math',level=1,step=0,score=0,total=0,locked=false,current=null,memorizeTimer=null;const names=Object.fromEntries(subjects.map(s=>[s[0],s[2]]));const random=n=>Math.floor(Math.random()*n),pick=a=>a[random(a.length)];function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=random(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}function options(answer,values){let all=[answer,...values.filter(x=>String(x)!==String(answer))];return shuffle([...new Map(all.map(x=>[String(x),x])).values()].slice(0,4))}function numericOptions(answer,max){let vals=[answer-2,answer-1,answer+1,answer+2,answer+3,answer-3].filter(x=>x>=0&&x<=max&&x!==answer);while(vals.length<3)vals.push(answer+vals.length+4);return options(answer,shuffle(vals).slice(0,3))}function question(){if(type==='math'){let limit=[0,5,10,20][level],a=random(limit+1),b=random(limit+1),op=random(2)?'+':'−';if(op==='−'&&b>a)[a,b]=[b,a];if(op==='+'&&a+b>limit)b=limit-a;let answer=op==='+'?a+b:a-b;return {text:a+' '+op+' '+b+' = ?',detail:level===1?'Можно считать на пальчиках ✋':'Реши пример и выбери ответ',answer,choices:numericOptions(answer,Math.max(10,limit+6)),hint:'Попробуй посчитать по одному.'}}if(type==='compare'){let limit=[0,5,10,20][level],a=random(limit+1),b=random(limit+1);let answer=a>b?'>':a<b?'<':'=';return{text:a+'  ?  '+b,detail:'Какой знак подходит?',answer,choices:shuffle(['>','<','=']),hint:'Сравни количество слева и справа.'}}if(type==='logic'){let start=random(4)+1,d=level,seq=[start,start+d,start+2*d,start+3*d];return{text:seq.slice(0,3).join(' · ')+' · ?',detail:'Продолжи числовой ряд',answer:seq[3],choices:numericOptions(seq[3],25),hint:'Посмотри, на сколько увеличивается число.'}}if(type==='letters'){let abc='АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ'.split(''),idx=random(abc.length-1),answer=abc[idx+1];return{text:abc[idx]+' → ?',detail:'Какая буква идёт следующей?',answer,choices:options(answer,shuffle(abc.filter(x=>x!==answer)).slice(0,3)),hint:'Вспомни алфавит по порядку.'}}if(type==='attention'){let icons=['🍎','🍐','🍋','🍓','🍒','🍇','🍉','🍊'];let a=pick(icons),b=pick(icons.filter(x=>x!==a));return{text:[a,a,b,a,a].join(' '),detail:'Какой предмет отличается?',answer:b,choices:options(b,shuffle(icons.filter(x=>x!==b)).slice(0,3)),hint:'Посмотри, что повторяется чаще.'}}let digits=Array.from({length:level+1},()=>1+random(4));let answer=digits.join('');let variants=[...new Set([digits.slice().reverse().join(''),digits.map((v,i)=>i===0?v%4+1:v).join(''),digits.map((v,i)=>i===digits.length-1?v%4+1:v).join(''),'1234','4321'])].filter(x=>x!==answer&&x.length===answer.length);while(variants.length<3){let x=Array.from({length:digits.length},()=>1+random(4)).join('');if(x!==answer&&!variants.includes(x))variants.push(x)}return{text:'👀 Запомни: '+digits.join('  '),detail:'Через 4 секунды выбери последовательность',answer,choices:options(answer,variants.slice(0,3)),hint:'Повтори числа про себя.',memory:true}}function updateTotal(){ $('total').textContent=total;$('stars').textContent='⭐ '+total}function showHome(){clearTimeout(memorizeTimer);$('home').classList.remove('hidden');$('lesson').classList.add('hidden');$('finish').classList.add('hidden');updateTotal()}function start(t){type=t;level=1;step=0;score=0;$('home').classList.add('hidden');$('finish').classList.add('hidden');$('lesson').classList.remove('hidden');$('lessonName').textContent=names[type];drawLevels();render()}function drawLevels(){$('levels').innerHTML='';['Легко','Средне','Сложно'].forEach((name,i)=>{let b=document.createElement('button');b.className='chip'+(level===i+1?' selected':'');b.textContent=(i+1)+' · '+name;b.onclick=()=>{level=i+1;step=0;score=0;drawLevels();render()};$('levels').appendChild(b)})}function render(){clearTimeout(memorizeTimer);locked=false;current=question();$('stepLabel').textContent='Задание '+(step+1)+' из 10';$('correctLabel').textContent='⭐ '+score;$('fill').style.width=step*10+'%';$('task').textContent=current.text;$('detail').textContent=current.detail;$('message').textContent='';$('next').classList.add('hidden');$('answers').innerHTML='';if(current.memory){$('answers').classList.add('hidden');memorizeTimer=setTimeout(()=>{$('task').textContent='❓ Что ты запомнил?';$('answers').classList.remove('hidden');makeButtons()},4000)}else{$('answers').classList.remove('hidden');makeButtons()}}function makeButtons(){current.choices.forEach(value=>{let b=document.createElement('button');b.className='answer';b.textContent=value;b.onclick=()=>answer(value,b);$('answers').appendChild(b)})}function answer(value,button){if(locked)return;if(String(value)!==String(current.answer)){button.classList.add('bad');$('message').textContent='💛 Попробуй ещё! '+current.hint;return}locked=true;score++;total++;updateTotal();button.classList.remove('bad');button.classList.add('good');$('message').textContent=pick(['🌟 Верно!','👏 Отлично!','💚 Молодец!','🎉 Супер!']);$('answers').querySelectorAll('button').forEach(b=>b.disabled=true);$('next').classList.remove('hidden');$('next').textContent=step===9?'Посмотреть результат 🏆':'Следующее задание ➜'}function next(){if(!locked)return;step++;if(step>=10){$('lesson').classList.add('hidden');$('finish').classList.remove('hidden');$('result').textContent='Ты решил 10 заданий по теме «'+names[type]+'»! Правильных ответов: '+score+'.';return}render()}subjects.forEach(s=>{let b=document.createElement('button');b.className='tile';b.innerHTML='<span class="emoji">'+s[1]+'</span><b>'+s[2]+'</b><small>'+s[3]+'</small>';b.onclick=()=>start(s[0]);$('subjects').appendChild(b)});$('back').onclick=showHome;$('next').onclick=next;$('again').onclick=()=>start(type);$('toHome').onclick=showHome;updateTotal()})();
</script></body></html>
