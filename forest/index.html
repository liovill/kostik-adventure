<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Костик и Кирилл: Волшебный лес</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#b6ecff,#e6f9ff);font-family:system-ui;color:#234b55;text-align:center;overflow:hidden;touch-action:none}header{height:52px;display:flex;align-items:center;justify-content:space-around;font-weight:900}header a{background:#fff;border-radius:14px;padding:9px;color:#246;text-decoration:none}#mission{background:#fff9d9;border-radius:14px;margin:2px 12px 8px;padding:8px;font-weight:800}canvas{display:block;width:min(96vw,500px);height:min(66dvh,680px);margin:auto;border:5px solid white;border-radius:24px;box-shadow:0 8px 0 #80b96b;touch-action:none;background:#9cda7e}.controls{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:510px;margin:auto}.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,48px);gap:2px}.pad button,.action{border:0;background:white;border-radius:15px;font-size:24px;box-shadow:0 3px 0 #acd1d5;touch-action:none}.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}.action{width:94px;height:94px;background:#ffdf77;font-size:19px;font-weight:900}#hint{font-size:12px;margin:0 10px;color:#537}@media(max-height:750px){canvas{height:min(53dvh,520px)}.pad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,42px)}.action{width:80px;height:80px}}</style></head><body><header><a href="../">🏠 Игры</a><span id="hud">❤️❤️❤️ ⭐ 0/5</span></header><div id="mission">🌟 Собери 5 звёзд и открой волшебные ворота!</div><canvas id="game"></canvas><div class="controls"><div class="pad"><button class="u" data-dir="0,-1">⬆️</button><button class="l" data-dir="-1,0">⬅️</button><button class="r" data-dir="1,0">➡️</button><button class="d" data-dir="0,1">⬇️</button></div><button class="action" id="power">🛡️<br>ЩИТ</button></div><div id="hint">Кирилл следует за Костиком. Щит спасает от дракона!</div><script>(function(){const c=document.getElementById('game'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),mission=document.getElementById('mission');const world={w:1200,h:1500};let hero={x:130,y:130},buddy={x:90,y:155},dragon={x:850,y:850},stars=[{x:240,y:240},{x:500,y:350},{x:760,y:560},{x:410,y:980},{x:960,y:1180}],collected=new Set(),hp=3,shield=0,inv=0,won=false;let keys=new Set(),touch=null,last=0;const trees=[];let seed=12345;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}for(let i=0;i<115;i++)trees.push({x:60+rnd()*1080,y:80+rnd()*1350,r:22+rnd()*15});function resize(){let b=c.getBoundingClientRect();c.width=Math.round(b.width*devicePixelRatio);c.height=Math.round(b.height*devicePixelRatio)}window.addEventListener('resize',resize);resize();function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function text(t,x,y,size=26){ctx.font='bold '+size+'px system-ui';ctx.textAlign='center';ctx.fillText(t,x,y)}function draw(){const scale=c.width/390,viewH=c.height/scale,camX=Math.max(0,Math.min(world.w-390,hero.x-195)),camY=Math.max(0,Math.min(world.h-viewH,hero.y-viewH*.48));ctx.save();ctx.scale(scale,scale);ctx.fillStyle='#a7e58a';ctx.fillRect(0,0,390,viewH);ctx.translate(-camX,-camY);ctx.fillStyle='#e8c78a';ctx.beginPath();ctx.moveTo(110,0);ctx.bezierCurveTo(300,380,700,450,520,850);ctx.bezierCurveTo(370,1160,790,1250,1080,1500);ctx.lineWidth=100;ctx.strokeStyle='#ebd6a6';ctx.stroke();ctx.fillStyle='#6fc4eb';ctx.beginPath();ctx.ellipse(1020,300,140,210,-.2,0,7);ctx.fill();for(const t of trees){ctx.fillStyle='#8a613d';ctx.fillRect(t.x-7,t.y-5,14,32);ctx.fillStyle='#388e57';ctx.beginPath();ctx.arc(t.x,t.y-14,t.r,0,7);ctx.fill();ctx.fillStyle='#65b96c';ctx.beginPath();ctx.arc(t.x-9,t.y-23,t.r*.6,0,7);ctx.fill()}for(let i=0;i<80;i++){let x=(i*163)%1150+25,y=(i*271)%1450+25;text(i%3?'🌼':'🌸',x,y,15)}for(let i=0;i<stars.length;i++)if(!collected.has(i))text('⭐',stars[i].x,stars[i].y,38);ctx.fillStyle='#8b5a44';ctx.fillRect(1060,1390,110,70);text('🏰',1110,1448,68);text('🐉',dragon.x,dragon.y,60);text('👶🏼',buddy.x,buddy.y,42);if(shield>0){ctx.strokeStyle='#42b9ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(hero.x,hero.y-15,35,0,7);ctx.stroke()}text('🧒🏻',hero.x,hero.y,55);ctx.restore()}function update(dt){if(won)return;let vx=0,vy=0;for(const k of keys){if(k==='ArrowLeft')vx--;if(k==='ArrowRight')vx++;if(k==='ArrowUp')vy--;if(k==='ArrowDown')vy++}if(touch){vx+=touch[0];vy+=touch[1]}let mag=Math.hypot(vx,vy);if(mag){vx/=mag;vy/=mag;hero.x=Math.max(24,Math.min(world.w-24,hero.x+vx*170*dt));hero.y=Math.max(35,Math.min(world.h-30,hero.y+vy*170*dt))}let bdx=hero.x-buddy.x,bdy=hero.y-buddy.y;if(Math.hypot(bdx,bdy)>50){buddy.x+=bdx*dt*2;buddy.y+=bdy*dt*2}let ddx=hero.x-dragon.x,ddy=hero.y-dragon.y,dl=Math.hypot(ddx,ddy);if(dl<420&&dl>5){dragon.x+=ddx/dl*65*dt;dragon.y+=ddy/dl*65*dt}if(dl<60&&inv<=0){if(shield>0){shield=0;inv=2;dragon.x+=220;mission.textContent='🛡️ Щит спас Костика!'}else{hp--;inv=2;hero.x=130;hero.y=130;dragon.x=850;dragon.y=850;mission.textContent='🐉 Дракон догнал! Берегись!';if(hp<=0){hp=3;collected.clear();mission.textContent='💪 Попробуем ещё!'}}}for(let i=0;i<stars.length;i++)if(!collected.has(i)&&dist(hero,stars[i])<50){collected.add(i);mission.textContent='⭐ Молодец! Найдено '+collected.size+' из 5!'}if(collected.size===5&&hero.x>1020&&hero.y>1350){won=true;mission.textContent='🏆 ПОБЕДА! Костик и Кирилл спасли королевство!'}shield=Math.max(0,shield-dt);inv=Math.max(0,inv-dt);hud.textContent='❤️'.repeat(hp)+'🤍'.repeat(3-hp)+' ⭐ '+collected.size+'/5'}function loop(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir.split(',').map(Number),k=d[0]<0?'ArrowLeft':d[0]>0?'ArrowRight':d[1]<0?'ArrowUp':'ArrowDown';b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});document.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();keys.add(e.key)}});document.addEventListener('keyup',e=>keys.delete(e.key));document.getElementById('power').onclick=()=>{shield=5;mission.textContent='🛡️ Волшебный щит действует 5 секунд!'};c.addEventListener('pointerdown',e=>{let r=c.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,t=Math.hypot(dx,dy)||1;touch=[dx/t,dy/t];c.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel'])c.addEventListener(ev,()=>touch=null);requestAnimationFrame(loop)})();</script></body></html>
