<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Костик и Кирилл: Волшебный лес</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#b6ecff,#e6f9ff);font-family:system-ui;color:#234b55;text-align:center;overflow:hidden;touch-action:none}header{height:52px;display:flex;align-items:center;justify-content:space-around;font-weight:900}header a{background:#fff;border-radius:14px;padding:9px;color:#246;text-decoration:none}#mission{background:#fff9d9;border-radius:14px;margin:2px 12px 8px;padding:8px;font-weight:800}canvas{display:block;width:min(96vw,500px);height:min(62dvh,680px);margin:auto;border:5px solid white;border-radius:24px;box-shadow:0 8px 0 #80b96b;touch-action:none;background:#9cda7e}.controls{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:510px;margin:auto}.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,48px);gap:2px}.pad button,.action{border:0;background:white;border-radius:15px;font-size:24px;box-shadow:0 3px 0 #acd1d5;touch-action:none}.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}.action{width:94px;height:94px;background:#ffdf77;font-size:19px;font-weight:900}#hint{font-size:12px;margin:0 10px;color:#537}@media(max-height:750px){canvas{height:min(50dvh,520px)}.pad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,42px)}.action{width:80px;height:80px}}#progress{display:flex;justify-content:space-between;padding:0 18px 6px;max-width:520px;margin:auto;font-weight:800;font-size:12px}.actions{display:flex;gap:10px}.action{width:76px;height:76px;font-size:16px}.attack{background:#ffadac}.controls{padding:10px 12px}.pad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,45px)}#overlay{position:fixed;inset:0;background:#142b4bbd;z-index:10;display:grid;place-items:center;padding:24px}.hidden{display:none!important}.modal{background:#fff9e8;border:5px solid #ffdb79;border-radius:28px;padding:28px;max-width:380px;box-shadow:0 12px 40px #1026}.modal #ovIcon{font-size:70px}.modal h2{font-size:30px}.modal button{background:#75cc7a;color:#163d26;border:0;border-radius:16px;font-weight:900;padding:16px 22px;font-size:19px}button:active{transform:scale(.95)}@media(max-width:380px){.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,42px)}.action{width:67px;height:67px;font-size:14px}.actions{gap:6px}}@media(max-height:750px){#mission{font-size:13px}.controls{padding:5px 12px}} </style></head><body><header><a href="../">🏠 Игры</a><span id="hud">❤️❤️❤️ ⭐ 0/5</span></header><div id="mission" aria-live="polite">🌟 Собери 5 звёзд и открой волшебные ворота!</div><div id="progress"><span id="stage">🌲 Уровень 1: Волшебный лес</span><span id="time">⏱️ 0:00</span></div><canvas id="game"></canvas><div class="controls"><div class="pad"><button class="u" data-dir="0,-1">⬆️</button><button class="l" data-dir="-1,0">⬅️</button><button class="r" data-dir="1,0">➡️</button><button class="d" data-dir="0,1">⬇️</button></div><div class="actions"><button class="action" id="power">🛡️<br>ЩИТ</button><button class="action attack" id="attack">⚔️<br>УДАР</button></div></div><div id="hint">🧒 Костик и 👶 Кирилл вместе побеждают дракона!</div><div id="overlay" class="hidden"><div class="modal"><div id="ovIcon">🏆</div><h2 id="ovTitle">Победа!</h2><p id="ovText"></p><button id="restart">🔄 Играть ещё</button></div></div><script>(()=>{
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),hud=document.getElementById('hud'),mission=document.getElementById('mission'),stage=document.getElementById('stage'),clock=document.getElementById('time'),overlay=document.getElementById('overlay');
const W=390, world={w:1250,h:1640}, stars=[{x:245,y:230},{x:530,y:390},{x:900,y:570},{x:400,y:1080},{x:1030,y:1320}];
let hero,buddy,dragon,collected,hp,shield,shieldCooldown,attackCooldown,inv,won,dead,elapsed,particles,tipTimer,dragonStun;
let keys=new Set(),touch=null,last=0,cam={x:0,y:0},viewH=620;
let seed=5318;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const trees=[],flowers=[],rocks=[];
for(let i=0;i<150;i++){let x=40+rnd()*1160,y=50+rnd()*1520;if(Math.hypot(x-135,y-135)>105&&Math.hypot(x-1110,y-1530)>115)trees.push({x,y,r:19+rnd()*15,t:rnd()})}
for(let i=0;i<185;i++)flowers.push({x:20+rnd()*1210,y:20+rnd()*1600,t:rnd()});
for(let i=0;i<26;i++)rocks.push({x:40+rnd()*1150,y:40+rnd()*1550});
function reset(){hero={x:135,y:135};buddy={x:95,y:155};dragon={x:860,y:900};collected=new Set();hp=4;shield=0;shieldCooldown=0;attackCooldown=0;inv=0;won=false;dead=false;elapsed=0;particles=[];tipTimer=0;dragonStun=0;overlay.classList.add('hidden');mission.textContent='🌟 Собери 5 звёзд и открой ворота замка!';updateHud()}
function resize(){let r=c.getBoundingClientRect();let d=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));viewH=W*c.height/c.width;ctx.imageSmoothingEnabled=true}
window.addEventListener('resize',resize);resize();
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function emoji(v,x,y,size){ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(v,x,y)}
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function heroArt(x,y,small=false){ctx.save();ctx.translate(x,y);const z=small?.72:1;ctx.scale(z,z);ctx.fillStyle='#3b3b57';ctx.beginPath();ctx.ellipse(0,22,21,7,0,0,7);ctx.fill();ctx.fillStyle=small?'#ffb968':'#4b8dff';round(-17,-2,34,31,11,ctx.fillStyle);ctx.fillStyle='#ffd1a2';ctx.beginPath();ctx.arc(0,-18,20,0,7);ctx.fill();ctx.fillStyle=small?'#d2a06d':'#49322d';ctx.beginPath();ctx.arc(0,-27,19,Math.PI,Math.PI*2);ctx.lineTo(19,-21);ctx.lineTo(10,-32);ctx.lineTo(-9,-30);ctx.lineTo(-18,-18);ctx.closePath();ctx.fill();ctx.fillStyle='#27283b';ctx.beginPath();ctx.arc(-7,-17,2.3,0,7);ctx.arc(7,-17,2.3,0,7);ctx.fill();ctx.strokeStyle='#b76868';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-12,6,.15,Math.PI-.15);ctx.stroke();ctx.fillStyle='#ffe59c';ctx.beginPath();ctx.arc(-17,4,6,0,7);ctx.arc(17,4,6,0,7);ctx.fill();ctx.restore()}
function dragonArt(x,y){ctx.save();ctx.translate(x,y+Math.sin(elapsed*2)*4);ctx.fillStyle='#6145a8';ctx.beginPath();ctx.moveTo(-18,-8);ctx.lineTo(-51,-40);ctx.lineTo(-43,13);ctx.lineTo(-15,20);ctx.moveTo(18,-8);ctx.lineTo(51,-40);ctx.lineTo(43,13);ctx.lineTo(15,20);ctx.fill();ctx.fillStyle='#8a5be0';ctx.beginPath();ctx.ellipse(0,0,32,29,0,0,7);ctx.fill();ctx.fillStyle='#b6a3f8';ctx.beginPath();ctx.ellipse(0,12,17,14,0,0,7);ctx.fill();ctx.fillStyle='#7e50c6';ctx.beginPath();ctx.moveTo(-24,-17);ctx.lineTo(-17,-43);ctx.lineTo(-4,-22);ctx.moveTo(24,-17);ctx.lineTo(17,-43);ctx.lineTo(4,-22);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(-11,-8,8,0,7);ctx.arc(11,-8,8,0,7);ctx.fill();ctx.fillStyle='#292047';ctx.beginPath();ctx.arc(-10,-7,4,0,7);ctx.arc(10,-7,4,0,7);ctx.fill();ctx.fillStyle='#f5a3b5';ctx.beginPath();ctx.ellipse(0,8,8,5,0,0,7);ctx.fill();ctx.restore()}
function say(msg){mission.textContent=msg;tipTimer=5}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let ang=rnd()*Math.PI*2,spd=40+rnd()*120;particles.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:.65+rnd()*.45,color})}}
function updateHud(){hud.textContent='❤️'.repeat(hp)+'🤍'.repeat(4-hp)+' ⭐ '+collected.size+'/5';stage.textContent=collected.size===5?'🏰 Иди к замку!':'🌲 Волшебный лес';clock.textContent='⏱️ '+Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0')}
function finish(success){won=success;dead=!success;overlay.classList.remove('hidden');document.getElementById('ovIcon').textContent=success?'🏆🐉':'💪🌈';document.getElementById('ovTitle').textContent=success?'Костик, победа!':'Попробуем снова!';document.getElementById('ovText').textContent=success?'Костик и Кирилл собрали все звёзды и спасли Волшебный лес!':'Кирилл верит в тебя! Используй щит и удар, чтобы защититься от дракона.'}
function update(dt){if(won||dead)return;elapsed+=dt;shield=Math.max(0,shield-dt);shieldCooldown=Math.max(0,shieldCooldown-dt);attackCooldown=Math.max(0,attackCooldown-dt);inv=Math.max(0,inv-dt);dragonStun=Math.max(0,dragonStun-dt);tipTimer=Math.max(0,tipTimer-dt);
let vx=0,vy=0;for(const k of keys){if(k==='ArrowLeft'||k==='a')vx--;if(k==='ArrowRight'||k==='d')vx++;if(k==='ArrowUp'||k==='w')vy--;if(k==='ArrowDown'||k==='s')vy++}if(touch){vx+=touch[0];vy+=touch[1]}let m=Math.hypot(vx,vy);if(m){hero.x=Math.max(30,Math.min(world.w-30,hero.x+vx/m*195*dt));hero.y=Math.max(40,Math.min(world.h-35,hero.y+vy/m*195*dt))}
let bx=hero.x-buddy.x,by=hero.y-buddy.y,bd=Math.hypot(bx,by);if(bd>60){buddy.x+=bx/bd*Math.min(bd-55,240*dt);buddy.y+=by/bd*Math.min(bd-55,240*dt)}
let dx=hero.x-dragon.x,dy=hero.y-dragon.y,dd=Math.hypot(dx,dy);if(dd<540&&dd>4&&dragonStun<=0){dragon.x+=dx/dd*66*dt;dragon.y+=dy/dd*66*dt}
if(dd<61&&inv<=0){if(shield>0){shield=0;shieldCooldown=5;inv=2;dragonStun=2;dragon.x-=dx/dd*130;dragon.y-=dy/dd*130;burst(hero.x,hero.y,'#6edaff');say('🛡️ Щит отразил дракона!')}else{hp--;inv=2.5;dragonStun=1.5;dragon.x=860;dragon.y=900;hero.x=Math.max(65,hero.x-90);hero.y=Math.max(65,hero.y-90);burst(hero.x,hero.y,'#ff8383');say('💛 Осторожно, дракон!');if(hp<=0){finish(false)}}}
for(let i=0;i<stars.length;i++)if(!collected.has(i)&&dist(hero,stars[i])<58){collected.add(i);burst(stars[i].x,stars[i].y,'#ffdf56',20);say(collected.size===5?'🏰 Все звёзды найдены! Иди к замку внизу справа!':'🌟 Отлично! Звёзд: '+collected.size+' из 5')}
if(collected.size===5&&hero.x>1010&&hero.y>1440){finish(true);burst(hero.x,hero.y,'#ffe17c',40)}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
if(!tipTimer)mission.textContent=collected.size===5?'🏰 Все звёзды собраны! Найди замок на юго-востоке!':'🌟 Собери звёзды: '+collected.size+'/5. Кирилл рядом!';
document.getElementById('power').textContent=shield>0?'🛡️ '+Math.ceil(shield)+'с':shieldCooldown>0?'⏳ '+Math.ceil(shieldCooldown)+'с':'🛡️ ЩИТ';updateHud()}
function draw(){const scale=c.width/W;cam.x=Math.max(0,Math.min(world.w-W,hero.x-W*.5));cam.y=Math.max(0,Math.min(world.h-viewH,hero.y-viewH*.47));ctx.save();ctx.scale(scale,scale);
let sky=ctx.createLinearGradient(0,0,0,viewH);sky.addColorStop(0,'#a9e9a0');sky.addColorStop(1,'#77c981');ctx.fillStyle=sky;ctx.fillRect(0,0,W,viewH);ctx.translate(-cam.x,-cam.y);
ctx.strokeStyle='#f3d7a0';ctx.lineWidth=84;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(130,100);ctx.bezierCurveTo(420,290,810,400,600,810);ctx.bezierCurveTo(400,1160,790,1250,1100,1520);ctx.stroke();
ctx.fillStyle='#64c9df';ctx.beginPath();ctx.ellipse(1060,290,120,180,-.3,0,7);ctx.fill();ctx.strokeStyle='#c5f7fb';ctx.lineWidth=7;ctx.stroke();
for(const fl of flowers)if(fl.x>cam.x-20&&fl.x<cam.x+W+20&&fl.y>cam.y-20&&fl.y<cam.y+viewH+20)emoji(fl.t>.5?'🌼':'🌷',fl.x,fl.y,15);
for(const rock of rocks)if(rock.x>cam.x-30&&rock.x<cam.x+W+30&&rock.y>cam.y-30&&rock.y<cam.y+viewH+30)emoji('🪨',rock.x,rock.y,23);
for(const tree of trees)if(tree.x>cam.x-50&&tree.x<cam.x+W+50&&tree.y>cam.y-70&&tree.y<cam.y+viewH+70){round(tree.x-8,tree.y-2,16,34,5,'#98633b');ctx.fillStyle='#257a55';ctx.beginPath();ctx.arc(tree.x,tree.y-14,tree.r,0,7);ctx.fill();ctx.fillStyle='#54b66c';ctx.beginPath();ctx.arc(tree.x-8,tree.y-22,tree.r*.7,0,7);ctx.fill();ctx.fillStyle='#a6e681';ctx.beginPath();ctx.arc(tree.x-13,tree.y-29,tree.r*.28,0,7);ctx.fill()}
for(let i=0;i<stars.length;i++)if(!collected.has(i)){let p=stars[i];emoji('⭐',p.x,p.y+Math.sin(elapsed*3+i)*5,43)}
round(1030,1430,160,110,20,'#cda96d');emoji('🏰',1110,1480,112);if(collected.size===5)emoji('✨',1105,1395,42);
dragonArt(dragon.x,dragon.y);heroArt(buddy.x,buddy.y,true);
if(inv<=0||Math.floor(elapsed*9)%2===0)heroArt(hero.x,hero.y);
if(shield>0){ctx.strokeStyle='#5ce7ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(hero.x,hero.y,39+Math.sin(elapsed*8)*3,0,7);ctx.stroke()}
for(const p of particles){ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,5,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();
const target=collected.size===5?{x:1110,y:1480}:stars.filter((_,i)=>!collected.has(i)).sort((a,b)=>dist(hero,a)-dist(hero,b))[0];if(target){let x=target.x-cam.x,y=target.y-cam.y;if(x<30||x>W-30||y<38||y>viewH-38){let angle=Math.atan2(y-viewH/2,x-W/2),px=W/2+Math.cos(angle)*Math.min(W*.40,140),py=viewH/2+Math.sin(angle)*Math.min(viewH*.39,200);ctx.save();ctx.translate(px,py);ctx.rotate(angle);ctx.fillStyle='#fff0a6';ctx.strokeStyle='#4d6e54';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(19,0);ctx.lineTo(-11,-13);ctx.lineTo(-5,0);ctx.lineTo(-11,13);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}}}
function loop(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}
document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir.split(',').map(Number),k=d[0]<0?'ArrowLeft':d[0]>0?'ArrowRight':d[1]<0?'ArrowUp':'ArrowDown';b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(k))});
document.addEventListener('keydown',e=>{let k=e.key.length===1?e.key.toLowerCase():e.key;if(k.startsWith('Arrow')||'wasd'.includes(k)){e.preventDefault();keys.add(k)}if(k===' '){e.preventDefault();attack()}});
document.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));
function attack(){if(attackCooldown>0||won||dead)return;attackCooldown=.55;burst(hero.x+20,hero.y-15,'#ffe27b',8);if(dist(hero,dragon)<125){dragonStun=2.2;let dx=dragon.x-hero.x,dy=dragon.y-hero.y,d=Math.hypot(dx,dy)||1;dragon.x+=dx/d*160;dragon.y+=dy/d*160;say('⚔️ Костик прогнал дракона!')}else say('⚔️ Суперудар!')}
document.getElementById('attack').addEventListener('click',attack);
document.getElementById('power').addEventListener('click',()=>{if(shieldCooldown>0||won||dead)return;shield=5;shieldCooldown=10;say('🛡️ Щит включён на 5 секунд!')});
document.getElementById('restart').addEventListener('click',reset);
c.addEventListener('pointerdown',e=>{e.preventDefault();let r=c.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy)||1;touch=[dx/d,dy/d];c.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(ev,()=>touch=null);
window.addEventListener('blur',()=>{keys.clear();touch=null});
reset();requestAnimationFrame(loop);
})();</script></body></html>
