<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Костик: Драконий лабиринт</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#c4efff,#f2faff);color:#173a58;font-family:system-ui,Arial;text-align:center}header{padding:9px;display:flex;justify-content:space-around;align-items:center;gap:8px;font-weight:800}a{color:#164269;background:#fff;padding:9px;border-radius:12px;text-decoration:none}h1{font-size:clamp(21px,5vw,30px);margin:2px}#info{font-weight:800;margin:3px;min-height:22px}#board{width:min(94vw,480px,48dvh);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);border:6px solid #fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 0 #76b27e;touch-action:manipulation}.cell{display:flex;align-items:center;justify-content:center;background:#a8e294;font-size:clamp(16px,4.5vw,29px);line-height:1}.wall{background:#738f79}.cell:nth-child(even):not(.wall){background:#9bd888}.controls{display:grid;grid-template-columns:repeat(3,56px);gap:4px;justify-content:center;margin:8px auto 4px;position:relative;z-index:2}.controls button{border:0;background:#fff;border-radius:14px;min-height:44px;font-size:23px;box-shadow:0 3px 0 #a5c9da;touch-action:manipulation}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}#message{font-size:16px;font-weight:800;min-height:32px;padding:4px 8px}#reset{padding:8px 16px;background:#ffdf70;border:0;border-radius:12px;font-weight:800;font-size:16px}small{display:block;padding:5px 10px 90px;color:#567}@media(max-height:740px){#board{width:min(88vw,41dvh)}header{padding:5px}h1{font-size:20px}.controls{margin:4px auto}.controls button{min-height:40px}small{padding-bottom:110px}}</style></head><body><header><a href="../">🏠 Все игры</a><span id="stats">❤️❤️❤️ · ⭐ 0</span></header><h1>🐉 Драконий лабиринт</h1><div id="info">Уровень 1 из 10</div><main id="board" aria-label="Лабиринт"></main><div id="message" role="status">Найди 🔑, затем открой 🚪. Берегись дракона!</div><div class="controls"><button class="up" data-d="0,-1">⬆️</button><button class="left" data-d="-1,0">⬅️</button><button class="down" data-d="0,1">⬇️</button><button class="right" data-d="1,0">➡️</button></div><button id="reset">🔄 Начать заново</button><small>Управление: стрелки или кнопки. Кирилл 👶🏼 ждёт у выхода!</small><script>(function(){const W=10,board=document.getElementById('board'),msg=document.getElementById('message'),stats=document.getElementById('stats'),info=document.getElementById('info');let level=1,stars=0,lives=3,px=0,py=0,key=false,dragon={x:8,y:2},walls=new Set(),items=new Set(),busy=false;try{let v=JSON.parse(localStorage.getItem('kostik_maze_v1')||'{}');level=Math.max(1,Math.min(10,Number(v.level)||1));stars=Math.max(0,Number(v.stars)||0)}catch(e){}const pos=(x,y)=>y*W+x;function save(){try{localStorage.setItem('kostik_maze_v1',JSON.stringify({level:level,stars:stars}))}catch(e){}}function layout(){walls=new Set();let pattern=[ [2,0,2,7],[5,2,5,9],[7,0,7,6] ];for(let i=0;i<pattern.length;i++){let p=pattern[i],gap=(level+i*3)%7+1;for(let y=p[1];y<=p[3];y++){if(y!==gap&&y!==gap+1)walls.add(pos(p[0],y))}}for(let x=0;x<10;x++){walls.delete(pos(x,0));walls.delete(pos(x,9))}walls.delete(pos(0,0));walls.delete(pos(9,9));walls.delete(pos(8,2));walls.delete(pos(8,8));walls.delete(pos(1,8));walls.delete(pos(4,4));}function start(){px=0;py=0;key=false;lives=3;dragon={x:8,y:2};layout();items=new Set([pos(1,8),pos(4,4),pos(8,8)]);busy=false;msg.textContent='Собери звёзды ⭐, найди ключ 🔑 и доберись до Кирилла 👶🏼';draw()}function draw(){board.innerHTML='';for(let y=0;y<10;y++)for(let x=0;x<10;x++){let c=document.createElement('div'),p=pos(x,y);c.className='cell'+(walls.has(p)?' wall':'');let v=walls.has(p)?'🪨':'';if(x===9&&y===9)v='🚪';if(x===8&&y===8&&!key)v='🔑';if(items.has(p))v='⭐';if(dragon.x===x&&dragon.y===y)v='🐉';if(px===x&&py===y)v='🧒🏻';c.textContent=v;board.appendChild(c)}stats.textContent='❤️'.repeat(lives)+'🤍'.repeat(3-lives)+' · ⭐ '+stars;info.textContent='Уровень '+level+' из 10'+(key?' · 🔑 ключ найден':'')}function hit(){lives--;if(lives<=0){msg.textContent='🐉 Дракон поймал Костика! Попробуем ещё!';start();return}px=0;py=0;dragon={x:8,y:2};msg.textContent='🐉 Дракон догнал! Осталось жизней: '+lives;draw()}function move(dx,dy){if(busy)return;let nx=px+dx,ny=py+dy;if(nx<0||nx>9||ny<0||ny>9||walls.has(pos(nx,ny))){msg.textContent='🪨 Здесь стена. Найди другой путь!';return}px=nx;py=ny;let p=pos(px,py);if(items.delete(p)){stars++;msg.textContent='⭐ Звезда найдена!';save()}if(px===8&&py===8&&!key){key=true;msg.textContent='🔑 Ключ найден! Теперь к выходу!'}if(px===9&&py===9){if(!key){msg.textContent='🚪 Дверь закрыта. Найди ключ!'}else if(level===10){busy=true;msg.textContent='🏆 Победа! Костик спас Кирилла и прошёл все 10 уровней!';draw();return}else{level++;save();start();msg.textContent='🎉 Новый уровень! Дракон становится хитрее!';return}}if(dragon.x===px&&dragon.y===py){hit();return}for(let step=0;step<(level>=6?2:1);step++){let opts=[[1,0],[-1,0],[0,1],[0,-1]].map(a=>({x:dragon.x+a[0],y:dragon.y+a[1]})).filter(v=>v.x>=0&&v.x<10&&v.y>=0&&v.y<10&&!walls.has(pos(v.x,v.y)));opts.sort((a,b)=>(Math.abs(a.x-px)+Math.abs(a.y-py))-(Math.abs(b.x-px)+Math.abs(b.y-py)));if(opts.length){let choice=opts[0];dragon=choice}if(dragon.x===px&&dragon.y===py){hit();return}}draw()}document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{let d=b.dataset.d.split(',').map(Number);move(d[0],d[1])}));document.addEventListener('keydown',e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d){e.preventDefault();move(d[0],d[1])}});document.getElementById('reset').onclick=()=>{level=1;stars=0;save();start()};start()})();</script></body></html>
