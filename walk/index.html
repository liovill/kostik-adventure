<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#16345d"><title>Костик: Охота за звёздами</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:linear-gradient(#a5e8ff,#d9f9ff);color:#16345d;text-align:center;overscroll-behavior:none}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;max-width:720px;margin:auto}a{color:#173e69;text-decoration:none;background:white;border-radius:12px;padding:9px;font-weight:800}.score{font-weight:900;font-size:18px}h1{font-size:clamp(21px,5vw,30px);margin:4px 0 8px}p{margin:5px 10px 12px}#field{position:relative;margin:0 auto;width:min(96vw,620px);height:min(60vh,440px);min-height:280px;background:repeating-linear-gradient(90deg,#77c96d 0 60px,#7fd374 60px 120px);border:7px solid #f8fff5;border-radius:25px;box-shadow:0 8px 0 #4f9c54;overflow:hidden;touch-action:none}#hero,#buddy,#star{position:absolute;transform:translate(-50%,-50%);user-select:none;pointer-events:none}#hero{font-size:52px;z-index:2}#buddy{font-size:38px;z-index:1}#star{font-size:39px;filter:drop-shadow(0 0 6px #ffed52)}.controls{display:grid;grid-template-columns:repeat(3,64px);gap:5px;justify-content:center;margin:16px auto 6px}.controls button{height:53px;font-size:25px;border:0;border-radius:15px;background:#fff;box-shadow:0 4px 0 #8fc4d5;touch-action:manipulation}.controls button:active{transform:translateY(3px)}.controls .up{grid-column:2}.controls .left{grid-column:1;grid-row:2}.controls .down{grid-column:2;grid-row:2}.controls .right{grid-column:3;grid-row:2}#msg{font-weight:800;min-height:27px;margin:12px}footer{font-size:13px;padding:0 8px 18px}</style></head><body><header><a href="../">🏠 Все игры</a><div class="score" id="score">⭐ 0</div><a href="../classic/">🏰 Викторина</a></header><h1>🌟 Охота за звёздами</h1><p>Помоги Костику собрать звёзды! Обходи камень 🪨 и убегай от дракона 🐉</p><main id="field" aria-label="Игровое поле"><div id="star">⭐</div><div id="buddy">👶🏼</div><div id="hero">🧒🏻</div><div id="dragon" aria-label="Дракон" style="position:absolute;font-size:43px;transform:translate(-50%,-50%);pointer-events:none">🐉</div><div id="rock" aria-label="Камень" style="position:absolute;font-size:43px;transform:translate(-50%,-50%);pointer-events:none">🪨</div></main><div class="controls"><button class="up" data-d="up" aria-label="Вверх">⬆️</button><button class="left" data-d="left" aria-label="Влево">⬅️</button><button class="down" data-d="down" aria-label="Вниз">⬇️</button><button class="right" data-d="right" aria-label="Вправо">➡️</button></div><div id="msg" role="status">Собери первую звёздочку! ⭐</div><footer>Нажимай стрелки, используй клавиатуру или касайся игрового поля</footer><script>(function(){var field=document.getElementById('field'),hero=document.getElementById('hero'),buddy=document.getElementById('buddy'),star=document.getElementById('star'),scoreEl=document.getElementById('score'),msg=document.getElementById('msg'),dragon=document.getElementById('dragon'),rock=document.getElementById('rock');var x=50,y=50,bx=40,by=58,sx=75,sy=28,n=0,dx=15,dy=18,rx=65,ry=70,invulnerable=false;try{n=Number(localStorage.getItem('kostik_walk_stars'))||0}catch(e){}function paint(){dragon.style.left=dx+'%';dragon.style.top=dy+'%';rock.style.left=rx+'%';rock.style.top=ry+'%';hero.style.left=x+'%';hero.style.top=y+'%';buddy.style.left=bx+'%';buddy.style.top=by+'%';star.style.left=sx+'%';star.style.top=sy+'%';scoreEl.textContent='⭐ '+n+' · 🏆 '+(Math.floor(n/5)+1)}function collect(){if(Math.hypot(x-sx,y-sy)<9){n++;try{localStorage.setItem('kostik_walk_stars',n)}catch(e){}msg.textContent=n%5===0?'🏆 Новый уровень! Костик, ты чемпион!':'🎉 Ура! Кирилл радуется! 👶🏼';do{sx=10+Math.random()*80;sy=12+Math.random()*76}while(Math.hypot(sx-dx,sy-dy)<16||Math.hypot(sx-rx,sy-ry)<13);paint()}}function move(mx,my){var nx=Math.max(6,Math.min(94,x+mx)),ny=Math.max(10,Math.min(90,y+my));if(Math.hypot(nx-rx,ny-ry)<11){msg.textContent='🪨 Камень! Обойди его!';return}bx=x;by=y;x=nx;y=ny;paint();collect();danger()}function danger(){if(Math.hypot(x-dx,y-dy)<12&&!invulnerable){invulnerable=true;msg.textContent='🐉 Дракон! Костик убежал в безопасное место!';x=50;y=50;bx=40;by=58;paint();setTimeout(function(){invulnerable=false},1000)}}document.querySelectorAll('[data-d]').forEach(function(b){b.addEventListener('click',function(){var d=b.dataset.d;move(d==='left'?-7:d==='right'?7:0,d==='up'?-9:d==='down'?9:0)})});document.addEventListener('keydown',function(e){var k={ArrowUp:[0,-9],ArrowDown:[0,9],ArrowLeft:[-7,0],ArrowRight:[7,0]}[e.key];if(k){e.preventDefault();move(k[0],k[1])}});field.addEventListener('pointerdown',function(e){var r=field.getBoundingClientRect(),tx=(e.clientX-r.left)/r.width*100,ty=(e.clientY-r.top)/r.height*100;bx=x;by=y;x=Math.max(6,Math.min(94,tx));y=Math.max(10,Math.min(90,ty));paint();collect();danger()});setInterval(function(){var a=Math.atan2(y-dy,x-dx);dx=Math.max(7,Math.min(93,dx+Math.cos(a)*1.2));dy=Math.max(10,Math.min(90,dy+Math.sin(a)*1.2));paint();danger()},900);paint()})();</script></body></html>
